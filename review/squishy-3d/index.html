</main><script>
(()=>{'use strict';

const names=['Lawendowy','Truskawkowy','Brzoskwiniowy','Toffi','Miętowy'];
const pastel=['#c7adf5','#ffb6c9','#ffc79d','#dfb79c','#c3e5ad'];
const skins=[
 ['Listek','#b7e8a5','leaf'],['Kwiatek','#ffc2df','flower'],['Korona','#dcc7ff','crown'],
 ['Kropeczki','#b2e1e8','dots'],['Kocie uszy','#ffdbab','cat'],['Trzy włoski','#ebc3b0','hair'],
 ['Płomyk','#ffc5a6','flame'],['Fontanna','#bde2fa','fountain'],['Pluszak','#d2c6f2','plush']
];
let coins=0,unlocked=[],selected=-1,highScore=0,paidBands=0,earned=0,queue=[],history=[],traces=[];
const storageKey='squishy-merge-v3';
function loadSave(){
 // The leaf Squishy is free and always belongs to every player, including old saves.
 unlocked=[0];selected=0;coins=0;highScore=0;
 try{
  const x=JSON.parse(localStorage.getItem(storageKey)||'{}');
  coins=Math.max(0,Number(x.coins)||0);highScore=Math.max(0,Number(x.highScore)||0);
  if(Array.isArray(x.unlocked)){
   for(const skin of x.unlocked)if(Number.isInteger(skin)&&skin>=1&&skin<9&&!unlocked.includes(skin))unlocked.push(skin);
  }
  if(unlocked.includes(x.selected))selected=x.selected;
 }catch(e){/* corrupted or blocked storage starts with the free skin */}
}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({coins,unlocked,selected,highScore}))}catch(e){}}
function refreshWallet(){for(const id of ['walletMenu','walletCollection','walletShop'])document.getElementById(id).querySelector('.walletAmount').textContent=coins;const gameAmount=document.getElementById('inGameCoins');if(gameAmount)gameAmount.textContent=coins}
function award(){let n=Math.floor(points/10000);if(n<=paidBands)return;let gain=(n-paidBands)*5;
 coins+=gain;earned+=gain;paidBands=n;message='+'+gain+' cukierków!';msgAge=0;save();refreshWallet()}
function pickKind(){const weights=[34,30,24,10,2],recent=history.slice(-5);
 const allowed=weights.map((w,k)=>({k,w})).filter(o=>!(recent.at(-1)===o.k&&recent.at(-2)===o.k)
 && !(o.k===0&&recent.filter(v=>v===0).length>=2));
 let x=Math.random()*allowed.reduce((s,v)=>s+v.w,0);
 for(const a of allowed){x-=a.w;if(x<=0)return a.k}return allowed.at(-1).k;
}
function fillQueue(){while(queue.length<4){let k=pickKind();if(drops>=30&&!issuedRainbow&&!queue.includes(-1)&&Math.random()<.0025)k=-1;
 else if(drops>=15&&Math.random()<.009)k=-2;queue.push(k);history.push(k);if(history.length>6)history.shift();}}
function drawQueue(){const canvas=document.getElementById('nextCanvas'),c=canvas.getContext('2d');c.clearRect(0,0,600,165);
 c.save();c.scale(3,3);queue.slice(0,3).forEach((k,i)=>sprite(c,k,38+66*i,28,20));c.restore()}

const finalAtlas=new Image();let finalAtlasReady=false;
finalAtlas.onload=()=>{finalAtlasReady=true;refreshViews()};
finalAtlas.src='assets/squishy-assets.webp';
const homeArt=new Image();let homeReady=false;
homeArt.onload=()=>{homeReady=true;drawHome()};
homeArt.src='assets/squishy-home.webp';
// Core game tiers use real cutouts from the same polished atlas as the shop.
const GAME_ASSETS=[3,1,0,2,5];
const R=[21,31,42,53,67,73],W=360,H=465,gravity=520,cap=345;const kindSprite={0:0,1:1,2:2,3:3,4:4,'-1':5,'-2':6,'-3':7};
const cvs=document.querySelector('#board'),hero=document.querySelector('#hero'),ctx=cvs.getContext('2d'),hc=hero.getContext('2d');
const status=document.querySelector('#status'),feedback=document.querySelector('#feedback'),count=document.querySelector('#count');
let bodies=[],puffs=[],petals=[],fusions=[],active=null,points=0,merges=0,pops=0,spills=0,drops=0,aim=180,heldFor=0,blockedFor=0,last=0,acc=0,playing=false,id=0,issuedRainbow=false,message='',msgAge=0,petalTime=0,pointer=null,paintTime=0;
const r=b=>b.kind===-3?11:b.kind<0?21:(R[b.kind]||73);
function asset(c,index,x,y,size){
 if(!finalAtlasReady)return false;
 const cell=144,col=index%5,row=Math.floor(index/5);
 c.drawImage(finalAtlas,col*cell,row*cell,cell,cell,x-size/2,y-size/2,size,size);
 return true;
}
const rr=(a,b)=>Math.random()*(b-a)+a;


function mochiPath(c,r){
 c.beginPath();c.moveTo(-r*.82,r*.29);c.bezierCurveTo(-r*1.06,-r*.23,-r*.84,-r*.75,-r*.43,-r*.78);
 c.bezierCurveTo(-r*.2,-r*.83,-r*.22,-r*1.12,0,-r*1.09);
 c.bezierCurveTo(r*.22,-r*1.08,r*.2,-r*.83,r*.44,-r*.78);
 c.bezierCurveTo(r*.89,-r*.74,r*1.08,-r*.22,r*.84,r*.3);
 c.bezierCurveTo(r*.65,r*.91,-r*.66,r*.91,-r*.82,r*.29);c.closePath();
}
function decoration(c,skin,r){
 const sk=skins[skin];if(!sk)return;const type=sk[2];c.save();c.lineCap='round';
 if(type==='dots'){c.fillStyle='#fff9';for(const [x,y] of [[-.55,-.33],[.53,-.4],[.59,.38],[-.55,.35]]){c.beginPath();c.arc(r*x,r*y,r*.065,0,7);c.fill();}}
 if(type==='leaf'){for(const s of [-1,1]){c.fillStyle=s<0?'#78c39d':'#8ac96f';c.beginPath();c.ellipse(s*r*.2,-r*.99,r*.16,r*.3,s*.6,0,7);c.fill()}}
 if(type==='flower'){c.translate(r*.36,-r*.85);for(let j=0;j<5;j++){c.save();c.rotate(j*Math.PI*2/5);c.fillStyle='#ff8bb9';c.beginPath();c.ellipse(0,-r*.14,r*.105,r*.17,0,0,7);c.fill();c.restore()}c.fillStyle='#fff19d';c.beginPath();c.arc(0,0,r*.09,0,7);c.fill()}
 if(type==='crown'){c.fillStyle='#ffe18c';c.strokeStyle='#dba95a';c.lineWidth=r*.035;c.beginPath();c.moveTo(-r*.44,-r*.77);c.lineTo(-r*.43,-r*1.14);c.lineTo(-r*.18,-r*.96);c.lineTo(0,-r*1.24);c.lineTo(r*.18,-r*.96);c.lineTo(r*.44,-r*1.14);c.lineTo(r*.44,-r*.77);c.closePath();c.fill();c.stroke()}
 if(type==='cat'){for(const s of [-1,1]){c.fillStyle='#ffdfb4';c.beginPath();c.moveTo(s*r*.16,-r*.89);c.lineTo(s*r*.52,-r*1.2);c.lineTo(s*r*.64,-r*.73);c.closePath();c.fill();c.fillStyle='#f5a0b4';c.beginPath();c.moveTo(s*r*.3,-r*.92);c.lineTo(s*r*.51,-r*1.10);c.lineTo(s*r*.56,-r*.85);c.fill()}}
 if(type==='hair'){c.strokeStyle='#403044';c.lineWidth=r*.045;for(let j=-1;j<=1;j++){let x=j*r*.17;c.beginPath();c.moveTo(x,-r*.76);c.quadraticCurveTo(x-r*.06,-r*1.08,x+r*.07,-r*1.12);c.stroke()}}
 if(type==='flame'){c.fillStyle='#ffa04d';c.beginPath();c.moveTo(-r*.21,-r*.78);c.quadraticCurveTo(-r*.29,-r*1.03,r*.08,-r*1.31);c.quadraticCurveTo(r*.11,-r*1.08,r*.25,-r*1.07);c.quadraticCurveTo(r*.38,-r*.76,0,-r*.74);c.fill();c.fillStyle='#ffe18d';c.beginPath();c.ellipse(0,-r*.91,r*.1,r*.15,0,0,7);c.fill()}
 if(type==='fountain'){c.strokeStyle='#8dcaee';c.lineWidth=r*.046;for(const s of [-1,0,1]){c.beginPath();c.moveTo(0,-r*.78);c.quadraticCurveTo(s*r*.3,-r*1.44,s*r*.47,-r*1.2);c.stroke();c.fillStyle='#c1f2fa';c.beginPath();c.ellipse(s*r*.47,-r*1.2,r*.06,r*.1,0,0,7);c.fill()}}
 if(type==='plush'){c.strokeStyle='#ffffffb9';c.lineWidth=r*.045;c.setLineDash([r*.07,r*.1]);c.beginPath();c.arc(0,0,r*.77,0,Math.PI);c.stroke();c.setLineDash([]);c.fillStyle='#ffa9d1';c.beginPath();c.ellipse(0,r*.56,r*.31,r*.12,0,0,7);c.fill()}
 c.restore();
}
function face(c,r,b){
 // Eyes and mouth share the mochi's transform, so they never drift.
 const t=paintTime+(b?.id||0)*.77,period=3.45+((b?.id||0)%5)*.33,phase=t%period;
 const blink=phase<.16?Math.sin(phase/.16*Math.PI):0,ey=r*.07,ex=r*.28,er=r*.087;
 c.save();c.lineCap='round';for(const s of [-1,1]){
  const x=s*ex;if(blink>.12){c.strokeStyle='#51394f';c.lineWidth=Math.max(1.2,r*.052);c.beginPath();c.moveTo(x-er*1.3,ey);c.quadraticCurveTo(x,ey+er*.8,x+er*1.3,ey);c.stroke();}
  else{c.fillStyle='#463549';c.beginPath();c.ellipse(x,ey,er,er*1.18,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x-er*.25+Math.sin(t*1.2)*r*.017,ey-er*.30,er*.27,0,7);c.fill();}
  c.fillStyle='#f49db6a3';c.beginPath();c.ellipse(s*r*.5,r*.26,r*.14,r*.08,0,0,7);c.fill();}
 const open=.5+.5*Math.sin(t*2.6);c.strokeStyle='#633f55';c.lineWidth=Math.max(1.2,r*.052);c.lineCap='round';
 if(open>.61){c.fillStyle='#a7536d';c.beginPath();c.ellipse(0,r*.38,r*.125,r*(.06+.04*open),0,0,7);c.fill();c.fillStyle='#ff99b0';c.beginPath();c.ellipse(0,r*.43,r*.06,r*.025,0,0,7);c.fill()}
 else{c.beginPath();c.moveTo(-r*.13,r*.34);c.quadraticCurveTo(0,r*.49,r*.13,r*.34);c.stroke()}
 c.restore();
}
function special(c,kind,r){
 if(kind===-2){c.fillStyle='#fff7ed';c.beginPath();c.arc(0,0,r*.93,0,7);c.fill();c.save();c.beginPath();c.arc(0,0,r*.9,0,7);c.clip();c.rotate(-.4);for(let i=-5;i<=5;i++){c.fillStyle=i%2?'#f37285':'#fff8f0';c.fillRect(i*r*.35,-r,r*.35,2*r)}c.restore();c.strokeStyle='#edb7b6';c.lineWidth=1.4;c.beginPath();c.arc(0,0,r*.9,0,7);c.stroke();}
 else if(kind===-1){let g=c.createConicGradient(paintTime,0,0);['#f3b1dc','#fff0a9','#b4f1d2','#b9d2ff','#d6bfff','#f3b1dc'].forEach((color,i)=>g.addColorStop(i/5,color));c.fillStyle=g;c.beginPath();c.arc(0,0,r*.9,0,7);c.fill();face(c,r,{id:3})}
 else{const g=c.createRadialGradient(-r*.4,-r*.4,1,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#a5d7ec77');c.fillStyle=g;c.beginPath();c.arc(0,0,r*.9,0,7);c.fill();}
}
function sprite(c,kind,x,y,radius,angle=0,impact=0,opacity=1,b=null){
 c.save();c.translate(x,y+(b?.held?Math.sin(paintTime*3+b.id)*.8:0));c.rotate(angle);
 const w=b?.squish||0,m=b?.morph||0,scale=1-m*.28+Math.sin((1-m)*Math.PI)*m*.10;
 c.scale(scale*(1+w*.17+impact*.06),scale*(1-w*.12-impact*.10));c.globalAlpha=opacity;
 c.shadowColor='#7055814f';c.shadowBlur=radius*.22;c.shadowOffsetY=radius*.12;
 if(kind===-2){if(!asset(c,9,0,0,radius*2.20))special(c,kind,radius);c.restore();return;}
 if(kind<0){special(c,kind,radius);c.restore();return;}
 // Every mochi on the board, including the small/medium stages, uses the real
 // transparent 3D assets. The same artwork is used in the upcoming-piece tray.
 const spriteIndex=kind===5
  ?(Number.isInteger(b?.skin)&&b.skin>=0&&b.skin<9?b.skin:0)
  :GAME_ASSETS[kind];
 if(spriteIndex!==undefined&&asset(c,spriteIndex,0,0,radius*2.34)){
  c.restore();return;
 }
 const base=kind===5?(skins[b?.skin??selected]?.[1]||'#b7e8a5'):pastel[kind];
 function shade(f){return 'rgb('+[1,3,5].map(i=>{const a=parseInt(base.slice(i,i+2),16);return Math.round(a+(f>0?(255-a)*f:a*f))}).join(',')+')'}
 const grad=c.createRadialGradient(-radius*.41,-radius*.55,1,0,radius*.15,radius*1.37);
 grad.addColorStop(0,shade(.69));grad.addColorStop(.38,shade(.33));grad.addColorStop(.75,base);grad.addColorStop(1,shade(-.22));
 mochiPath(c,radius);c.fillStyle=grad;c.fill();c.shadowBlur=0;c.shadowOffsetY=0;
 c.strokeStyle='#ffffff85';c.lineWidth=radius*.025;c.stroke();
 c.strokeStyle='#ffffff7f';c.lineWidth=radius*.048;c.lineCap='round';
 for(const j of [-2,-1,1,2]){c.beginPath();c.moveTo(j*radius*.055,-radius*.96);c.quadraticCurveTo(j*radius*.20,-radius*.66,j*radius*.22,-radius*.52);c.stroke();}
 c.fillStyle='#ffffff96';c.beginPath();c.ellipse(-radius*.39,-radius*.4,radius*.24,radius*.078,-.4,0,7);c.fill();
 if(kind===5)decoration(c,b?.skin??selected,radius);
 face(c,radius,b);c.restore();
}
function drawHome(){hc.clearRect(0,0,780,780);if(homeReady){hc.drawImage(homeArt,0,0,780,780);return;}hc.save();hc.scale(2,2);
 [[4,183,83,77],[3,310,168,72],[2,95,152,60],[1,194,190,50],[0,45,206,42]]
 .forEach(([k,x,y,r])=>sprite(hc,k,x,y,r,0,0,1,{id:k}));

function availableLane(kind,preferred=aim){
 const radius=kind<0?21:R[kind],cy=radius+6,edge=radius+2;
 const sx=Math.max(edge,Math.min(W-edge,preferred));
 const clear=x=>bodies.every(b=>b.held||Math.hypot(b.x-x,b.y-cy)>=r(b)+radius+3);
 if(clear(sx))return sx;
 let candidate=null,distance=Infinity;
 for(let x=edge;x<=W-edge;x+=3){
  if(clear(x)&&Math.abs(x-sx)<distance){candidate=x;distance=Math.abs(x-sx)}
 }
 return candidate;
}

function spawn(){
 if(!playing||active)return;

 if(lane===null){
  let index=queue.findIndex(k=>availableLane(k)!==null);
  if(index>0){kind=queue.splice(index,1)[0];lane=availableLane(kind)}
  else if(availableLane(0)!==null){kind=0;lane=availableLane(0)}
  else{blockedFor+=1/120;if(blockedFor>2.2)finish();return;}
 }else queue.shift();
 blockedFor=0;if(kind===-1)issuedRainbow=true;
 const radius=kind<0?21:R[kind];aim=lane;
 active={id:id++,kind,x:lane,y:radius+6,vx:0,vy:0,spin:0,angle:0,rollV:0,impact:0,squish:0,squishV:0,morph:0,held:true,cool:.23,rest:0};
 bodies.push(active);heldFor=0;fillQueue();drawQueue();
}

 bodies=[];puffs=[];petals=[];fusions=[];traces=[];active=null;points=0;merges=0;pops=0;spills=0;drops=0;aim=180;
 heldFor=0;blockedFor=0;issuedRainbow=false;playing=true;petalTime=0;message='';msgAge=0;id=0;
 earned=0;paidBands=0;queue=[];history=[];fillQueue();spawn();
}
function drop(){if(!playing||!active||!active.held)return;active.held=false;active.vy=Math.max(active.vy,120);heldFor=0;}
function aimAt(e){const rect=cvs.getBoundingClientRect();const radius=active?r(active):21;aim=Math.max(radius+2,Math.min(W-radius-2,(e.clientX-rect.left)/rect.width*W));if(active?.held)active.x=aim;}
let touchStart=null;cvs.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY,dragged:false};touchStart=e.clientY;aimAt(e);cvs.setPointerCapture(e.pointerId)});
cvs.addEventListener('pointermove',e=>{if(!pointer)return;aimAt(e);if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>12)pointer.dragged=true});
cvs.addEventListener('pointerup',e=>{if(!pointer)return;aimAt(e);drop();pointer=null});
cvs.addEventListener('pointercancel',()=>pointer=null);
function border(b){const radius=r(b);
 if(b.x<radius){b.x=radius;b.vx=Math.abs(b.vx)*.13}
 if(b.x>W-radius){b.x=W-radius;b.vx=-Math.abs(b.vx)*.13}
 if(b.y>H-radius){b.y=H-radius;if(b.vy>55){const hit=Math.min(.35,Math.abs(b.vy)/1100);b.impact=Math.max(b.impact,hit);b.squishV=(b.squishV||0)+hit*3.2;}if(b.vy>60)b.vy*= -.11;else b.vy=0;b.vx*=.78}
 if(b.y<radius){b.y=radius;b.vy=Math.max(0,b.vy)}
}
function touch(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<=r(a)+r(b)+4}
function collision(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.max(.01,Math.hypot(dx,dy)),overlap=r(a)+r(b)-d;if(overlap<=0)return;
 const nx=d<.02?1:dx/d,ny=d<.02?0:dy/d,ia=(21/r(a))**2,ib=(21/r(b))**2,w=ia+ib;
 a.x-=nx*overlap*.79*ia/w;b.x+=nx*overlap*.79*ib/w;
 a.y-=ny*overlap*.79*ia/w;b.y+=ny*overlap*.79*ib/w;
 const approach=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
 if(approach<0){const m=-approach*1.03/w;
 a.vx-=nx*m*ia;b.vx+=nx*m*ib;a.vy-=ny*m*ia;b.vy+=ny*m*ib;
 a.spin=Math.min(.55,Math.max(-.55,a.spin+approach*.0003));b.spin=Math.min(.55,Math.max(-.55,b.spin-approach*.0003));const hit=Math.min(.35,-approach/950);if(hit>.035){a.squishV=(a.squishV||0)+hit*2.1;b.squishV=(b.squishV||0)+hit*2.1;}}}
function puff(x,y,kind){puffs.push({x,y,kind,age:0})}
function collect(kind){for(const b of bodies)if(b.kind===kind)return true;return false}
function merge(){
 // The last two forms become one final form of the same size,
 // so they never grow and never release pellets.
 const ready=bodies.filter(b=>b.kind===5&&!b.held&&b.cool<=0);
 for(let i=0;i<ready.length;i++)for(let j=i+1;j<ready.length;j++){
  const a=ready[i],b=ready[j];if(!touch(a,b))continue;
  const keepSkin=a.skin>=0?a.skin:b.skin;
  const radius=R[5],x=Math.max(radius,Math.min(W-radius,(a.x+b.x)/2)),
    y=Math.max(radius,Math.min(H-radius,(a.y+b.y)/2));
  bodies=bodies.filter(q=>q!==a&&q!==b);
  bodies.push({id:id++,kind:5,skin:keepSkin,x,y,vx:(a.vx+b.vx)*.2,vy:0,
    spin:0,angle:0,rollV:0,impact:.2,squish:.15,squishV:0,morph:.6,
    held:false,cool:.6,rest:0});
  merges++;points+=180;award();message='✨ Merge!';msgAge=0;
  return true;
 }
 for(let kind=4;kind>=0;kind--){const seen=new Set();for(const seed of bodies){if(seed.kind!==kind||seed.held||seed.cool>0||seen.has(seed.id))continue;
 const group=[seed];seen.add(seed.id);for(let cur=0;cur<group.length;cur++)for(const q of bodies){if(q.kind===kind&&!q.held&&q.cool<=0&&!seen.has(q.id)&&touch(group[cur],q)){group.push(q);seen.add(q.id)}}
 const amount=kind===0?3:2;if(group.length<amount)continue;
 const found=group.slice(0,amount),x=found.reduce((s,b)=>s+b.x,0)/amount,y=found.reduce((s,b)=>s+b.y,0)/amount;
 let isActive=found.includes(active);fusions.push({parts:found.map(b=>({kind:b.kind,x:b.x,y:b.y,radius:r(b),angle:b.angle})),x,y,age:0});bodies=bodies.filter(b=>!found.includes(b));merges++;points+=[45,85,155,260,460][kind];award();

 if(kind===4){
   // Two green mochi become the selected final collectible form.
   // Final forms continue merging two into one, with fixed radius and no pellets.
   const big={id:id++,kind:5,skin:selected>=0?selected:0,x:Math.max(73,Math.min(W-73,x)),y:Math.max(73,Math.min(H-73,y)),
      vx:0,vy:-62,spin:0,angle:0,rollV:0,impact:.35,squish:.18,squishV:0,morph:1,
      held:false,cool:.54,rest:0,traceTimer:0};
   bodies.push(big);pops++;
   message='🌸 Końcowa forma!';msgAge=0;
 }else{const next=kind+1,RN=R[next];const bigger={id:id++,kind:next,x:Math.max(RN,Math.min(W-RN,x)),y:Math.max(RN,Math.min(H-RN,y)),vx:0,vy:0,spin:0,angle:0,rollV:0,impact:.4,squish:.15,squishV:0,morph:1,held:false,cool:.32,rest:0};bodies.push(bigger);
   for(let k=0;k<9;k++){for(const q of bodies)if(q!==bigger&&!q.held)collision(q,bigger);bodies.forEach(b=>{if(!b.held)border(b)})}
   message='✨ '+names[next]+'!';msgAge=0;}
 if(isActive){active=null;drops++;points+=5;}return true;
 }}return false}
function finish(){playing=false;active=null;highScore=Math.max(points,highScore);award();save();refreshWallet();message='KONIEC GRY! '+points+' pkt • cukierki +'+earned+' • rekord '+highScore;msgAge=0;}
function simulate(dt){if(!playing)return;msgAge+=dt;heldFor+=active?.held?dt:0;
 if(active?.held&&heldFor>=5)drop();
 petalTime+=dt;if(petalTime>.5&&petals.length<30){petalTime=0;petals.push({x:rr(0,W),y:-10,size:rr(3.5,7),age:0,speed:rr(20,38),phase:rr(0,7),settled:false})}
 for(const p of petals){p.age+=dt;if(!p.settled){p.y+=p.speed*dt;p.x+=Math.sin(p.phase+p.age*1.65)*13*dt;if(p.y>=H-5){p.y=H-rr(3,10);p.settled=true}}}
 petals=petals.filter(p=>p.age<(p.settled?19:29));
 puffs.forEach(p=>p.age+=dt);puffs=puffs.filter(p=>p.age<1.4);fusions.forEach(f=>f.age+=dt);fusions=fusions.filter(f=>f.age<.32);traces.forEach(t=>t.age+=dt);traces=traces.filter(t=>t.age<7);

 for(const b of bodies){
   b.cool=Math.max(0,b.cool-dt);b.impact=Math.max(0,b.impact-dt*2.4);
   b.morph=Math.max(0,(b.morph||0)-dt*2.8);
   b.squishV=(b.squishV||0)+(-36*(b.squish||0)-9*(b.squishV||0))*dt;
   b.squish=Math.max(-.24,Math.min(.35,(b.squish||0)+b.squishV*dt));
   if(b.held){b.x=aim;b.y=r(b)+6;b.vx=b.vy=b.spin=b.angle=b.rollV=0;continue}
   if(b===active)b.vx+=Math.max(-650,Math.min(650,(aim-b.x)*14-b.vx*8))*dt;
   b.vy=Math.min(cap,b.vy+gravity*dt);
   b.vx=Math.max(-188,Math.min(188,b.vx*Math.exp(-1.5*dt)));
   b.spin=Math.max(-.55,Math.min(.55,b.spin*Math.exp(-3*dt)));
   b.x+=b.vx*dt;b.y+=b.vy*dt;

   // Rolling follows lateral movement, then gently returns upright like soft mochi.
   const desired=Math.max(-.36,Math.min(.36,b.vx/Math.max(110,r(b)*4.2)*.5+b.spin*.3));
   b.rollV=(b.rollV||0)+(desired-(b.angle||0))*25*dt;
   b.rollV*=Math.exp(-7*dt);
   b.angle=Math.max(-.43,Math.min(.43,(b.angle||0)+b.rollV*dt));
   border(b);
 }
 for(let it=0;it<4;it++){for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++)if(!bodies[i].held&&!bodies[j].held)collision(bodies[i],bodies[j]);for(const b of bodies)if(!b.held)border(b)}
 for(let i=0;i<4;i++){if(!merge())break}

 // Never lose because a single tower reached the top. New pieces may still
 // spawn in any genuinely empty lane, including on the opposite side.
 if(active&&!active.held){const b=active;const supported=b.y>=H-r(b)-.7||bodies.some(q=>q!==b&&q.y>b.y&&touch(q,b));
   if(supported&&Math.abs(b.vy)<72)b.rest=(b.rest||0)+dt;else b.rest=0;
   if(b.rest>.18){active=null;drops++;points+=3;award();
     if(b.kind===-1){bodies=[];puffs=[];blockedFor=0;points+=140;award();puff(b.x,b.y,5);message='🌈 TĘCZOWY CLEAR!';msgAge=0}
     if(b.kind===-2){const cx=b.x,cy=b.y;let cleared=0;
       bodies=bodies.filter(other=>{if(other===b)return false;if(other.kind===-1||other.kind===-2)return true;
         const nearby=Math.hypot(other.x-cx,other.y-cy)<116+r(other)*.15;if(nearby)cleared++;return !nearby});
       blockedFor=0;points+=45+cleared*12;award();puff(cx,cy,6);message='PUF! '+cleared;msgAge=0}
     }}

}
function drawPetal(c,x,y,s,a,alpha){c.save();c.translate(x,y);c.rotate(a);c.globalAlpha=alpha;c.fillStyle='#f7adcf';c.strokeStyle='#e39cbb';c.lineWidth=.6;c.beginPath();c.moveTo(0,s*.43);c.bezierCurveTo(-s*.87,s*.04,-s*.55,-s*.95,0,-s*.86);c.bezierCurveTo(s*.53,-s*.98,s*.85,s*.02,0,s*.43);c.fill();c.stroke();c.restore()}
function cloud(c,p){const t=p.age/1.4;let fade=Math.max(0,1-t);
 if(t<.38)sprite(c,p.kind===4?4:-2,p.x,p.y,(43+t*120)*(p.kind===4?1.45:.8),0,0,1);
 for(let i=0;i<10;i++){const a=i*Math.PI/5,d=11+t*(40+i%3*5),x=p.x+Math.cos(a)*d,y=p.y+Math.sin(a)*d-t*18,sz=13+t*11;

function drawTrace(c,t){
 const a=Math.max(0,.28*(1-t.age/7)),r=3.4+Math.sin(t.age*2)*.4;

  c.rotate(-.55);c.fillStyle='#72be8c';c.beginPath();c.ellipse(0,0,r*.70,r*1.1,0,0,7);c.fill();
  c.strokeStyle='#4b9a68';c.lineWidth=.6;c.beginPath();c.moveTo(0,-r);c.lineTo(0,r);c.stroke();
 }else if(variant===1){ // sakura blossom
  c.fillStyle='#f68fb7';for(let j=0;j<5;j++){let an=j*Math.PI*2/5;c.beginPath();c.ellipse(Math.cos(an)*r*.56,Math.sin(an)*r*.56,r*.39,r*.57,an,0,7);c.fill()}

  c.strokeStyle='#ddb158';c.lineWidth=1.1;c.beginPath();c.moveTo(0,-r*1.6);c.lineTo(0,r*1.6);c.moveTo(-r*1.6,0);c.lineTo(r*1.6,0);c.stroke();
