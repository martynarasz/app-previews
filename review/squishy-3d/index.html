const cvs=document.querySelector('#board'),hero=document.querySelector('#hero'),ctx=cvs.getContext('2d'),hc=hero.getContext('2d');
const status=document.querySelector('#status'),feedback=document.querySelector('#feedback'),count=document.querySelector('#count');
let bodies=[],puffs=[],petals=[],active=null,points=0,merges=0,pops=0,spills=0,drops=0,aim=180,heldFor=0,roofHeld=0,last=0,acc=0,playing=false,id=0,issuedRainbow=false,message='',msgAge=0,petalTime=0,pointer=null;
const r=b=>b.kind===-3?11:b.kind<0?21:R[b.kind];
const rr=(a,b)=>Math.random()*(b-a)+a;
function sprite(c,kind,x,y,radius,angle=0,impact=0,opacity=1){
 const idx=kindSprite[kind]; if(!imageReady||idx===undefined)return;
 c.save();c.translate(x,y);c.rotate(angle);c.scale(1+impact*.07,1-impact*.13);c.globalAlpha=opacity;
 const side=radius*2.32,sy=Math.floor(idx/4)*256,sx=idx%4*256;
 c.shadowColor='#6c4b9760';c.shadowBlur=radius*.30;c.shadowOffsetY=radius*.12;
 c.drawImage(atlas,sx,sy,256,256,-side/2,-side/2,side,side);c.restore();
}
function drawHome(){if(!imageReady)return;
 hc.clearRect(0,0,780,510);hc.save();hc.scale(2,2);
 // Draw back to front in beautiful overlapping arrangement.
 const toys=[[4,192,87,80],[3,316,159,75],[2,94,153,59],[1,190,195,51],[0,45,212,43]];
 toys.forEach(t=>sprite(hc,t[0],t[1],t[2],t[3]));
 sprite(hc,-2,335,66,30);sprite(hc,-3,45,65,22);sprite(hc,-3,335,229,21);
 for(let j=0;j<11;j++)drawPetal(hc,25+j*36,14+j%3*23,4+j%3,j*.6,.75);
 hc.restore();}
function spawn(){if(!playing)return;
 const occupied=bodies.filter(b=>!b.held);
 // Never allow tall stacks to dodge game-over by dropping on the other side.
 if(occupied.length>=35||occupied.some(b=>b.y-r(b)<79))return finish();
 let v=Math.random()*100,kind=v<58?0:v<91?1:v<98?2:v<99.7?3:4;
 // Bonuses genuinely rare: candy after 12 drops ~1%; rainbow after 30 ~0.33%, at most once.
 if(drops>=30&&!issuedRainbow&&Math.random()<1/300){kind=-1;issuedRainbow=true}
 else if(drops>=12&&Math.random()<1/100)kind=-2;
 const radius=kind<0?21:R[kind];aim=Math.max(radius+2,Math.min(W-radius-2,aim));
 active={id:id++,kind,x:aim,y:radius+4,vx:0,vy:0,spin:0,angle:0,impact:0,held:true,cool:.23,rest:0};bodies.push(active);heldFor=0;}
function reset(){bodies=[];puffs=[];petals=[];active=null;points=0;merges=0;pops=0;spills=0;drops=0;aim=180;heldFor=0;roofHeld=0;issuedRainbow=false;playing=true;petalTime=0;message='';msgAge=0;id=0;spawn();}
function drop(){if(!playing||!active||!active.held)return;active.held=false;active.vy=Math.max(active.vy,120);heldFor=0;}
function aimAt(e){const rect=cvs.getBoundingClientRect();const radius=active?r(active):21;aim=Math.max(radius+2,Math.min(W-radius-2,(e.clientX-rect.left)/rect.width*W));if(active?.held)active.x=aim;}
let touchStart=null;cvs.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY,dragged:false};touchStart=e.clientY;aimAt(e);cvs.setPointerCapture(e.pointerId)});
cvs.addEventListener('pointermove',e=>{if(!pointer)return;aimAt(e);if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>12)pointer.dragged=true});
cvs.addEventListener('pointerup',e=>{if(!pointer)return;if(!pointer.dragged||(e.clientY-touchStart)>50)drop();pointer=null});
cvs.addEventListener('pointercancel',()=>pointer=null);
function border(b){const radius=r(b);
 if(b.x<radius){b.x=radius;b.vx=Math.abs(b.vx)*.13}
 if(b.x>W-radius){b.x=W-radius;b.vx=-Math.abs(b.vx)*.13}
 if(b.y>H-radius){b.y=H-radius;b.impact=Math.max(b.impact,Math.min(.6,Math.abs(b.vy)/950));if(b.vy>60)b.vy*= -.11;else b.vy=0;b.vx*=.73}
 if(b.y<radius){b.y=radius;b.vy=Math.max(0,b.vy)}
}
function touch(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<=r(a)+r(b)+4}
function collision(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.max(.01,Math.hypot(dx,dy)),overlap=r(a)+r(b)-d;if(overlap<=0)return;
 const nx=d<.02?1:dx/d,ny=d<.02?0:dy/d,ia=(21/r(a))**2,ib=(21/r(b))**2,w=ia+ib;
 a.x-=nx*overlap*.79*ia/w;b.x+=nx*overlap*.79*ib/w;
 a.y-=ny*overlap*.79*ia/w;b.y+=ny*overlap*.79*ib/w;
 const approach=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
 if(approach<0){const m=-approach*1.03/w;
 a.vx-=nx*m*ia;b.vx+=nx*m*ib;a.vy-=ny*m*ia;b.vy+=ny*m*ib;
 a.spin=Math.min(.38,Math.max(-.38,a.spin+approach*.00005));b.spin=Math.min(.38,Math.max(-.38,b.spin-approach*.00005));}}
function puff(x,y,kind){puffs.push({x,y,kind,age:0})}
function collect(kind){for(const b of bodies)if(b.kind===kind)return true;return false}
function merge(){for(let kind=4;kind>=0;kind--){const seen=new Set();for(const seed of bodies){if(seed.kind!==kind||seed.held||seed.cool>0||seen.has(seed.id))continue;
 const group=[seed];seen.add(seed.id);for(let cur=0;cur<group.length;cur++)for(const q of bodies){if(q.kind===kind&&!q.held&&q.cool<=0&&!seen.has(q.id)&&touch(group[cur],q)){group.push(q);seen.add(q.id)}}
 const amount=kind===0?3:2;if(group.length<amount)continue;
 const found=group.slice(0,amount),x=found.reduce((s,b)=>s+b.x,0)/amount,y=found.reduce((s,b)=>s+b.y,0)/amount;
 let isActive=found.includes(active);bodies=bodies.filter(b=>!found.includes(b));merges++;points+=kind===4?950:(kind+2)*90;
 if(kind===4){
   // Board-wide green burst only removes existing mochi and specials,
   // but glass marbles stay and new ones accumulate across explosions.
   const oldGlass=bodies.filter(b=>b.kind===-3);
   bodies=oldGlass; if(active&&active.kind!==-3)active=null;roofHeld=0;
   puff(x,y,4);
   for(let i=0;i<8;i++){const a=i*Math.PI/4;
     bodies.push({id:id++,kind:-3,x:Math.max(12,Math.min(W-12,x+Math.cos(a)*18)),y:Math.max(12,Math.min(H-12,y+Math.sin(a)*19)),vx:Math.cos(a)*110,vy:-50+Math.sin(a)*50,spin:0,angle:0,impact:0,held:false,cool:.55,rest:0});}
   spills+=8;message='💚 PUF! Szklane kuleczki!';msgAge=0;pops++;
 }else{const next=kind+1,RN=R[next];const bigger={id:id++,kind:next,x:Math.max(RN,Math.min(W-RN,x)),y:Math.max(RN,Math.min(H-RN,y)),vx:0,vy:0,spin:0,angle:0,impact:.4,held:false,cool:.32,rest:0};bodies.push(bigger);
   for(let k=0;k<9;k++){for(const q of bodies)if(q!==bigger&&!q.held)collision(q,bigger);bodies.forEach(b=>{if(!b.held)border(b)})}
   message='✨ '+names[next]+'!';msgAge=0;}
 if(isActive){active=null;drops++;points+=5;}return true;
 }}return false}
function finish(){playing=false;active=null;message='GAME OVER! Wynik: '+points;msgAge=0;}
function simulate(dt){if(!playing)return;msgAge+=dt;heldFor+=active?.held?dt:0;
 if(active?.held&&heldFor>=5)drop();
 petalTime+=dt;if(petalTime>.5&&petals.length<30){petalTime=0;petals.push({x:rr(0,W),y:-10,size:rr(3.5,7),age:0,speed:rr(20,38),phase:rr(0,7),settled:false})}
 for(const p of petals){p.age+=dt;if(!p.settled){p.y+=p.speed*dt;p.x+=Math.sin(p.phase+p.age*1.65)*13*dt;if(p.y>=H-5){p.y=H-rr(3,10);p.settled=true}}}
 petals=petals.filter(p=>p.age<(p.settled?19:29));
 puffs.forEach(p=>p.age+=dt);puffs=puffs.filter(p=>p.age<1.4);
 for(const b of bodies){b.cool=Math.max(0,b.cool-dt);b.impact=Math.max(0,b.impact-dt*2.4);
   if(b.held){b.x=aim;b.y=r(b)+4;b.vx=b.vy=b.spin=b.angle=0;continue}
   if(b===active)b.vx+=Math.max(-650,Math.min(650,(aim-b.x)*14-b.vx*8))*dt;
   b.vy=Math.min(cap,b.vy+gravity*dt);b.vx=Math.max(-188,Math.min(188,b.vx*Math.exp(-2*dt)));b.spin=Math.max(-.42,Math.min(.42,b.spin*Math.exp(-4*dt)));
   b.x+=b.vx*dt;b.y+=b.vy*dt;b.angle=Math.max(-.21,Math.min(.21,b.angle+b.spin*dt));border(b);
 }
 for(let it=0;it<4;it++){for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++)if(!bodies[i].held&&!bodies[j].held)collision(bodies[i],bodies[j]);for(const b of bodies)if(!b.held)border(b)}
 for(let i=0;i<4;i++){if(!merge())break}
 const occupied=bodies.some(b=>!b.held&&b.y-r(b)<78&&Math.abs(b.vy)<35);
 roofHeld=occupied?roofHeld+dt:0;if(roofHeld>1.0){finish();return}
 if(active&&!active.held){const b=active;const supported=b.y>=H-r(b)-.7||bodies.some(q=>q!==b&&q.y>b.y&&touch(q,b));
   if(supported&&Math.abs(b.vy)<72)b.rest=(b.rest||0)+dt;else b.rest=0;
   if(b.rest>.18){active=null;drops++;points+=5;
     if(b.kind===-1){bodies=[];puffs=[];roofHeld=0;points+=250;puff(b.x,b.y,5);message='🌈 TĘCZOWY CLEAR!';msgAge=0}
     if(b.kind===-2){const cx=b.x,cy=b.y;let cleared=0;
       bodies=bodies.filter(other=>{if(other===b)return false;if(other.kind===-1||other.kind===-2)return true;
         const nearby=Math.hypot(other.x-cx,other.y-cy)<116+r(other)*.15;if(nearby)cleared++;return !nearby});
       roofHeld=0;points+=75+cleared*45;puff(cx,cy,6);message='🍬 PUF! '+cleared;msgAge=0}
     spawn();}}
 if(!active&&playing)spawn();
}
function drawPetal(c,x,y,s,a,alpha){c.save();c.translate(x,y);c.rotate(a);c.globalAlpha=alpha;c.fillStyle='#f7adcf';c.strokeStyle='#e39cbb';c.lineWidth=.6;c.beginPath();c.moveTo(0,s*.43);c.bezierCurveTo(-s*.87,s*.04,-s*.55,-s*.95,0,-s*.86);c.bezierCurveTo(s*.53,-s*.98,s*.85,s*.02,0,s*.43);c.fill();c.stroke();c.restore()}
function cloud(c,p){const t=p.age/1.4;let fade=Math.max(0,1-t);
 if(t<.38)sprite(c,p.kind===4?4:6,p.x,p.y,(43+t*120)*(p.kind===4?1.45:.8),0,0,1);
 for(let i=0;i<10;i++){const a=i*Math.PI/5,d=11+t*(40+i%3*5),x=p.x+Math.cos(a)*d,y=p.y+Math.sin(a)*d-t*18,sz=13+t*11;
 const g=c.createRadialGradient(x,y,0,x,y,sz);g.addColorStop(0,'rgba(255,255,255,'+(fade*.75)+')');g.addColorStop(.55,'rgba(231,197,239,'+(fade*.4)+')');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,sz,0,7);c.fill()}}
function paint(){ctx.clearRect(0,0,720,930);ctx.save();ctx.scale(2,2);
 for(const p of petals.filter(p=>p.settled))drawPetal(ctx,p.x,p.y,p.size,-.3,.45);
 for(const b of bodies)sprite(ctx,b.kind,b.x,b.y,r(b),b.angle,b.impact);
 for(const p of puffs)cloud(ctx,p);
 for(const p of petals.filter(p=>!p.settled))drawPetal(ctx,p.x,p.y,p.size,.5+Math.sin(p.age*2)*.8,.7);
 ctx.restore();status.textContent='⭐ '+points+'　🍡 '+merges;
 const n=playing&&active?.held&&heldFor>=2?Math.max(1,3-Math.floor(heldFor-2)):0;
 const c=document.querySelector('#count');c.textContent=n||'';c.style.display=n?'block':'none';
 feedback.textContent=(!playing||msgAge<1.5)?message:'';
}
function loop(ts){if(!last)last=ts;const dt=Math.min(.06,(ts-last)/1000);last=ts;if(playing){acc+=dt;let n=0;while(acc>=1/120&&n<8){simulate(1/120);acc-=1/120;n++}}paint();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.querySelector('#play').onclick=()=>{document.querySelector('#home').style.display='none';document.querySelector('#game').style.display='block';reset()};
document.querySelector('#restart').onclick=reset;
document.querySelector('#back').onclick=()=>{playing=false;document.querySelector('#game').style.display='none';document.querySelector('#home').style.display='block'};
})();
</script></body></html>
