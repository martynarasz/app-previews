function loadSave(){
 // The leaf Squishy is free and always belongs to every player, including old saves.
 unlocked=[0];selected=0;coins=0;highScore=0;
 try{
  const x=JSON.parse(localStorage.getItem(storageKey)||'{}');
  coins=Math.max(0,Number(x.coins)||0);highScore=Math.max(0,Number(x.highScore)||0);
  if(Array.isArray(x.unlocked)){
   for(const skin of x.unlocked)if(Number.isInteger(skin)&&skin>=1&&skin<skins.length&&!unlocked.includes(skin))unlocked.push(skin);
  }
  if(unlocked.includes(x.selected))selected=x.selected;
   const oldVersion=Number(x.levelProgressVersion)||0;
   completedLevels=oldVersion>=2?Math.max(0,Math.min(levelStages.length,Math.floor(Number(x.completedLevels)||0))):0;
   experience=oldVersion>=3?Math.max(0,Number(x.experience)||0):
     (completedLevels?levelStages[completedLevels-1].at:0);
   if(oldVersion>=3&&Array.isArray(x.claimedLevels))
    for(const stage of x.claimedLevels)if(Number.isInteger(stage)&&stage>=1&&stage<=levelStages.length)claimedLevels.add(stage);
   // Earlier versions already paid these stages. Never grant them again on migration.
   for(let stage=1;stage<=completedLevels;stage++)claimedLevels.add(stage);
   if(claimedLevels.size)completedLevels=Math.max(completedLevels,...claimedLevels);
   experience=Math.max(experience,completedLevels?levelStages[completedLevels-1].at:0);
   speedChoice=[.8,1,1.25].includes(Number(x.speedChoice))?Number(x.speedChoice):1;
   tutorialSeen=!!x.tutorialSeen;
  if(x.run&&Array.isArray(x.run.bodies)&&x.run.bodies.length<=150)savedRun=x.run;
 }catch(e){/* corrupted or blocked storage starts with the free skin */}
}

function save(){
 try{
  if(playing){
   savedRun={points,merges,drops,paidBands,earned,runMergeTracked,issuedRainbow,id,aim,queue:[...queue],history:[...history],
    activeId:active?.id??null,bodies:bodies.map(b=>({...b}))};
  }else if(document.getElementById('game').style.display==='block'&&!active){
   savedRun=null; // completed round, not simply paused in menu
  }
  localStorage.setItem(storageKey,JSON.stringify({coins,unlocked,selected,highScore,experience,completedLevels,claimedLevels:[...claimedLevels],levelProgressVersion:3,speedChoice,tutorialSeen,run:savedRun}));
 }catch(e){/* storage may be disabled in private browsing */}
}
function resumeRun(){
 const s=savedRun;
 if(!s||!Array.isArray(s.bodies)||s.bodies.length>150)return false;
 try{
  points=Math.max(0,Number(s.points)||0);merges=Math.max(0,Number(s.merges)||0);
  drops=Math.max(0,Number(s.drops)||0);paidBands=Math.max(0,Number(s.paidBands)||0);
  earned=Math.max(0,Number(s.earned)||0);issuedRainbow=!!s.issuedRainbow;
   runMergeTracked=Number.isFinite(s.runMergeTracked)?Math.max(0,Number(s.runMergeTracked)):Math.max(0,Number(s.merges)||0);
  id=Math.max(1,Number(s.id)||1);aim=Math.max(20,Math.min(W-20,Number(s.aim)||W/2));
  queue=Array.isArray(s.queue)?s.queue.filter(n=>Number.isInteger(n)&&n>=-2&&n<=4).slice(0,4):[];
  history=Array.isArray(s.history)?s.history.filter(n=>Number.isInteger(n)&&n>=-2&&n<=4).slice(-6):[];
  bodies=s.bodies.filter(b=>Number.isInteger(b.kind)&&b.kind>=-3&&b.kind<=7&&
    Number.isFinite(b.x)&&Number.isFinite(b.y)).map(b=>({
     ...b,x:Math.max(0,Math.min(W,b.x)),y:Math.max(0,Math.min(H,b.y)),
     vx:Number(b.vx)||0,vy:Number(b.vy)||0,angle:Number(b.angle)||0,
     spin:Number(b.spin)||0,cool:.12,held:!!b.held,rest:0
    }));
  active=bodies.find(b=>b.id===s.activeId)||null;
  if(active&&!active.held)active=null;
  playing=true;heldFor=0;blockedFor=0;acc=0;last=0;
  fillQueue();if(!active)spawn();drawQueue();
  return true;
 }catch(e){savedRun=null;return false}
}

function updateLevel(){
 if(playing&&merges>runMergeTracked){experience+=merges-runMergeTracked;runMergeTracked=merges;}
 let achieved=0;
 while(achieved<levelStages.length&&experience>=levelStages[achieved].at)achieved++;
 if(achieved>completedLevels){
  let gained=0;
  for(let stage=completedLevels+1;stage<=achieved;stage++){
   if(!claimedLevels.has(stage)){claimedLevels.add(stage);gained+=25}
  }
  completedLevels=achieved;
  if(gained>0){
   coins+=gained;earned+=gained;
   message='🌟 '+tr.earnedMessage+'!';msgAge=0;refreshWallet();showLevelReward(gained);
  }
  save();
 }
 applyWorld(getStageWorld());
 const done=completedLevels===levelStages.length;
 const stage=levelStages[Math.min(completedLevels,levelStages.length-1)];
 const previous=completedLevels?levelStages[completedLevels-1].at:0;
 document.getElementById('levelName').textContent='🌸 '+tr.level+' '+Math.min(completedLevels+1,22)+'/22 · '+tr.worlds[stage.world];
 document.getElementById('levelRewardAmount').textContent=done?'🏆':'+25';
 document.querySelector('#levelReward .pepperCoin').style.display=done?'none':'inline-block';
 document.getElementById('levelReward').setAttribute('aria-label',done?tr.maxLevel:tr.reward+' +25 '+tr.candy);
 document.getElementById('levelGoal').textContent=done?tr.maxLevel:tr.nextGoal+': '+Math.max(0,stage.at-experience)+' '+tr.progressUnit;
 const pct=done?100:Math.max(0,Math.min(100,(experience-previous)/(stage.at-previous)*100));
 const fill=document.getElementById('levelFill');fill.style.width=pct+'%';fill.setAttribute('role','progressbar');fill.setAttribute('aria-valuenow',Math.round(pct));fill.setAttribute('aria-valuemin','0');fill.setAttribute('aria-valuemax','100');
}

function award(){updateLevel()} // Bonus candies come from levels, never a record score.
function pickKind(){const weights=[34,30,24,10,2],recent=history.slice(-5);
 const allowed=weights.map((w,k)=>({k,w})).filter(o=>!(recent.at(-1)===o.k&&recent.at(-2)===o.k)
 && !(o.k===0&&recent.filter(v=>v===0).length>=2));
 let x=Math.random()*allowed.reduce((s,v)=>s+v.w,0);
 for(const a of allowed){x-=a.w;if(x<=0)return a.k}return allowed.at(-1).k;
}
function rainbowAllowed(){
 const stable=bodies.filter(b=>!b.held&&b.kind>=0);
 if(stable.length<8)return false;
 if(stable.some(b=>b.kind>=3))return false;
 return stable.filter(b=>b.kind<=2).length>=8;
}
function removeInvalidRainbows(){
 if(rainbowAllowed())return;
 queue=queue.map(k=>k===-1?0:k);
 if(active?.kind===-1){
  active.kind=0;active.y=Math.max(r(active)+6,active.y);
  issuedRainbow=false;
 }
}
function fillQueue(){while(queue.length<4){let k=pickKind();if(drops>=30&&rainbowAllowed()&&!issuedRainbow&&!queue.includes(-1)&&Math.random()<.0025)k=-1;
 else if(drops>=15&&Math.random()<.009)k=-2;queue.push(k);history.push(k);if(history.length>6)history.shift();}}
function drawQueue(){const canvas=document.getElementById('nextCanvas'),c=canvas.getContext('2d');c.clearRect(0,0,600,165);
 c.save();c.scale(3,3);queue.slice(0,3).forEach((k,i)=>sprite(c,k,38+66*i,28,20));c.restore()}

function livingFace(c,kind,radius,b){
 // The original eyes and mouth already belong to the illustration.
 // Animate only tiny highlights INSIDE them: no extra displaced eye or mouth.
 const id=b.id||0,t=paintTime+id*.57;
 const blinking=(t%(4.1+(id%4)*.42))<.15;

  0:[], 1:[[-.31,.25]],2:[[-.30,.24],[.29,.24]],3:[],
  4:[[-.28,.22],[.29,.22]],5:[[-.29,.23],[.29,.23]]
 };
 const eyes=anchors[kind]||[];

 // Narrow pearly glints shift on existing eyes, never painting new pupils.
 for(const [ex,ey] of eyes){
  c.fillStyle='rgba(255,255,255,.72)';
  c.beginPath();
  c.ellipse((ex-.055+Math.sin(t*.9)*.015)*radius,(ey-.09)*radius,
    radius*.022,radius*.033,0,0,Math.PI*2);c.fill();
 }
 // A micro glint within the already-printed mouth reads as a lively smile.
 if((kind!==3)&&!blinking){
  c.fillStyle='rgba(255,205,220,.28)';
  c.beginPath();c.ellipse(0,radius*.48,radius*.070,radius*.014,0,0,Math.PI*2);c.fill();
 }
 c.restore();
}

function availableLane(kind,preferred=aim){

 const sx=Math.max(edge,Math.min(W-edge,preferred));
 const clear=x=>bodies.every(b=>b.held||Math.hypot(b.x-x,b.y-cy)>=r(b)+radius+3);
 if(clear(sx))return sx;
 let candidate=null,distance=Infinity;
 for(let x=edge;x<=W-edge;x+=3){
  if(clear(x)&&Math.abs(x-sx)<distance){candidate=x;distance=Math.abs(x-sx)}
 }
 return candidate;
}

function touch(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<=r(a)+r(b)+4}
function collision(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.max(.01,Math.hypot(dx,dy)),overlap=r(a)+r(b)-d;if(overlap<=0)return;
 const nx=d<.02?1:dx/d,ny=d<.02?0:dy/d,ia=(21/r(a))**2,ib=(21/r(b))**2,w=ia+ib;
 a.x-=nx*overlap*.79*ia/w;b.x+=nx*overlap*.79*ib/w;
 a.y-=ny*overlap*.79*ia/w;b.y+=ny*overlap*.79*ib/w;
 const approach=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
 if(approach<0){const m=-approach*1.03/w;
 a.vx-=nx*m*ia;b.vx+=nx*m*ib;a.vy-=ny*m*ia;b.vy+=ny*m*ib;
 a.spin=Math.min(.55,Math.max(-.55,a.spin+approach*.0003));b.spin=Math.min(.55,Math.max(-.55,b.spin-approach*.0003));const hit=Math.min(.35,-approach/950);if(hit>.035){a.squishV=(a.squishV||0)+hit*2.1;b.squishV=(b.squishV||0)+hit*2.1;}}}
function puff(x,y,kind){puffs.push({x,y,kind,age:0})}
function collect(kind){for(const b of bodies)if(b.kind===kind)return true;return false}
function merge(){
 // The last two forms become one final form of the same size,
 // so they never grow and never release pellets.
 const ready=bodies.filter(b=>b.kind===7&&!b.held&&b.cool<=0);
 for(let i=0;i<ready.length;i++)for(let j=i+1;j<ready.length;j++){
  const a=ready[i],b=ready[j];if(!touch(a,b))continue;
  const keepSkin=a.skin>=0?a.skin:b.skin;
  const radius=R[7],x=Math.max(radius,Math.min(W-radius,(a.x+b.x)/2)),
    y=Math.max(radius,Math.min(H-radius,(a.y+b.y)/2));
  bodies=bodies.filter(q=>q!==a&&q!==b);
  bodies.push({id:id++,kind:7,skin:keepSkin,x,y,vx:(a.vx+b.vx)*.2,vy:0,
    spin:0,angle:0,rollV:0,impact:.2,squish:.15,squishV:0,morph:.6,
    held:false,cool:.6,rest:0});
  merges++;points+=180;award();message='✨ '+tr.merge;msgAge=0;save();
  return true;
 }
 for(let kind=6;kind>=0;kind--){const seen=new Set();for(const seed of bodies){if(seed.kind!==kind||seed.held||seed.cool>0||seen.has(seed.id))continue;
 const group=[seed];seen.add(seed.id);for(let cur=0;cur<group.length;cur++)for(const q of bodies){if(q.kind===kind&&!q.held&&q.cool<=0&&!seen.has(q.id)&&touch(group[cur],q)){group.push(q);seen.add(q.id)}}
 const amount=kind===0?3:2;if(group.length<amount)continue;
 const found=group.slice(0,amount),x=found.reduce((s,b)=>s+b.x,0)/amount,y=found.reduce((s,b)=>s+b.y,0)/amount;
 let isActive=found.includes(active);fusions.push({parts:found.map(b=>({kind:b.kind,x:b.x,y:b.y,radius:r(b),angle:b.angle})),x,y,age:0});bodies=bodies.filter(b=>!found.includes(b));merges++;points+=[45,85,155,260,460,700,1050][kind];award();

 if(kind===6){
   // Two green mochi become the selected final collectible form.
   // Final forms continue merging two into one, with fixed radius and no pellets.
   const big={id:id++,kind:7,skin:selected>=0?selected:0,x:Math.max(R[7],Math.min(W-R[7],x)),y:Math.max(R[7],Math.min(H-R[7],y)),
      vx:0,vy:-62,spin:0,angle:0,rollV:0,impact:.35,squish:.18,squishV:0,morph:1,
      held:false,cool:.54,rest:0,traceTimer:0};
   bodies.push(big);pops++;
   message='🌸 '+tr.final;msgAge=0;
 }else{const next=kind+1,RN=R[next];const bigger={id:id++,kind:next,x:Math.max(RN,Math.min(W-RN,x)),y:Math.max(RN,Math.min(H-RN,y)),vx:0,vy:0,spin:0,angle:0,rollV:0,impact:.4,squish:.15,squishV:0,morph:1,held:false,cool:.32,rest:0};bodies.push(bigger);
   for(let k=0;k<9;k++){for(const q of bodies)if(q!==bigger&&!q.held)collision(q,bigger);bodies.forEach(b=>{if(!b.held)border(b)})}
   message='✨ '+(next===5?tr.flower:next===6?tr.crown:tr.tierNames[next])+'!';msgAge=0;}
 if(isActive){active=null;drops++;points+=5;}save();return true;
 }}return false}
function finish(){updateLevel();playing=false;active=null;highScore=Math.max(points,highScore);save();refreshWallet();message=tr.end+' '+points+' • +'+earned+' 🍬';msgAge=0;}
function simulate(dt){if(!playing)return;removeInvalidRainbows();msgAge+=dt;heldFor+=active?.held?dt:0;
 if(active?.held&&heldFor>=5)drop();
 petalTime+=dt;if(petalTime>.5&&petals.length<30){petalTime=0;petals.push({x:rr(0,W),y:-10,size:rr(3.5,7),age:0,speed:rr(20,38),phase:rr(0,7),settled:false})}
 for(const p of petals){p.age+=dt;if(!p.settled){p.y+=p.speed*dt;p.x+=Math.sin(p.phase+p.age*1.65)*13*dt;if(p.y>=H-5){p.y=H-rr(3,10);p.settled=true}}}
 petals=petals.filter(p=>p.age<(p.settled?19:29));
 puffs.forEach(p=>p.age+=dt);puffs=puffs.filter(p=>p.age<1.4);fusions.forEach(f=>f.age+=dt);fusions=fusions.filter(f=>f.age<.32);traces.forEach(t=>t.age+=dt);traces=traces.filter(t=>t.age<7);

 for(const b of bodies){
   b.cool=Math.max(0,b.cool-dt);b.impact=Math.max(0,b.impact-dt*2.4);
   b.morph=Math.max(0,(b.morph||0)-dt*2.8);
   b.squishV=(b.squishV||0)+(-36*(b.squish||0)-9*(b.squishV||0))*dt;
   b.squish=Math.max(-.24,Math.min(.35,(b.squish||0)+b.squishV*dt));
   if(b.held){b.x=aim;b.y=r(b)+6;b.vx=b.vy=b.spin=b.angle=b.rollV=0;continue}
   if(b===active)b.vx+=Math.max(-650,Math.min(650,(aim-b.x)*14-b.vx*8))*dt;
   b.vy=Math.min(cap,b.vy+gravity*dt);
   b.vx=Math.max(-188,Math.min(188,b.vx*Math.exp(-1.5*dt)));
   b.spin=Math.max(-.55,Math.min(.55,b.spin*Math.exp(-3*dt)));
   b.x+=b.vx*dt;b.y+=b.vy*dt;

   // Rolling follows lateral movement, then gently returns upright like soft mochi.
   const desired=Math.max(-.36,Math.min(.36,b.vx/Math.max(110,r(b)*4.2)*.5+b.spin*.3));
   b.rollV=(b.rollV||0)+(desired-(b.angle||0))*25*dt;
   b.rollV*=Math.exp(-7*dt);
   b.angle=Math.max(-.43,Math.min(.43,(b.angle||0)+b.rollV*dt));
   border(b);
 }
 for(let it=0;it<4;it++){for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++)if(!bodies[i].held&&!bodies[j].held)collision(bodies[i],bodies[j]);for(const b of bodies)if(!b.held)border(b)}
 for(let i=0;i<4;i++){if(!merge())break}

 // Never lose because a single tower reached the top. New pieces may still
 // spawn in any genuinely empty lane, including on the opposite side.
 if(active&&!active.held){const b=active;const supported=b.y>=H-r(b)-.7||bodies.some(q=>q!==b&&q.y>b.y&&touch(q,b));
   if(supported&&Math.abs(b.vy)<72)b.rest=(b.rest||0)+dt;else b.rest=0;
   if(b.rest>.18){active=null;drops++;points+=3;award();
     // Check right at impact, even if a large merge happened this very frame.
     if(b.kind===-1&&!rainbowAllowed()){b.kind=0;issuedRainbow=false;}
     if(b.kind===-1){bodies=[];puffs=[];blockedFor=0;points+=140;award();puff(b.x,b.y,5);message='🌈 '+tr.rainbow;msgAge=0}
     if(b.kind===-2){const cx=b.x,cy=b.y;let cleared=0;
       bodies=bodies.filter(other=>{if(other===b)return false;if(other.kind===-1||other.kind===-2)return true;
         const nearby=Math.hypot(other.x-cx,other.y-cy)<116+r(other)*.15;if(nearby)cleared++;return !nearby});
       blockedFor=0;points+=45+cleared*12;award();puff(cx,cy,6);message=tr.puff+' '+cleared;msgAge=0}
     save();}}
 if(!active&&playing)spawn();
}
function drawPetal(c,x,y,s,a,alpha){
 c.save();c.translate(x,y);c.rotate(a);c.globalAlpha=alpha;
 const world=selectedWorld;
 if(world==='candy'){
  c.fillStyle='#faadc6';c.strokeStyle='#fff3d5';c.lineWidth=1;
  c.beginPath();c.arc(0,0,s*.8,0,Math.PI*2);c.fill();c.stroke();
  c.strokeStyle='#fff';c.lineWidth=1.4;c.beginPath();c.arc(0,0,s*.43,0,Math.PI);c.stroke();
 }else if(world==='cloud'){
  c.fillStyle='#ffffff';c.beginPath();c.arc(-s*.4,0,s*.5,0,Math.PI*2);c.arc(0,-s*.3,s*.7,0,Math.PI*2);c.arc(s*.45,0,s*.5,0,Math.PI*2);c.fill();
 }else if(world==='star'||world==='moon'){
  c.fillStyle=world==='moon'?'#ffe5a6':'#ffe99d';c.beginPath();
  for(let i=0;i<10;i++){const ang=-Math.PI/2+i*Math.PI/5;const d=(i%2?s*.36:s);c.lineTo(Math.cos(ang)*d,Math.sin(ang)*d)}c.closePath();c.fill();
 }else if(world==='pumpkin'){
  c.fillStyle='#ffa65a';c.strokeStyle='#f18857';c.lineWidth=.8;
  c.beginPath();c.ellipse(0,0,s*.85,s*.75,0,0,Math.PI*2);c.fill();c.stroke();
  c.fillStyle='#79bb65';c.fillRect(-s*.1,-s*.92,s*.22,s*.35);
 }else{
  c.fillStyle='#f7adcf';c.strokeStyle='#e39cbb';c.lineWidth=.6;c.beginPath();
  c.moveTo(0,s*.43);c.bezierCurveTo(-s*.87,s*.04,-s*.55,-s*.95,0,-s*.86);
  c.bezierCurveTo(s*.53,-s*.98,s*.85,s*.02,0,s*.43);c.fill();c.stroke();
 }
 c.restore();
}
function cloud(c,p){const t=p.age/1.4;let fade=Math.max(0,1-t);
 if(t<.38)sprite(c,p.kind===4?4:-2,p.x,p.y,(43+t*120)*(p.kind===4?1.45:.8),0,0,1);
 for(let i=0;i<10;i++){const a=i*Math.PI/5,d=11+t*(40+i%3*5),x=p.x+Math.cos(a)*d,y=p.y+Math.sin(a)*d-t*18,sz=13+t*11;
 const g=c.createRadialGradient(x,y,0,x,y,sz);g.addColorStop(0,'rgba(255,255,255,'+(fade*.75)+')');g.addColorStop(.55,'rgba(231,197,239,'+(fade*.4)+')');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,sz,0,7);c.fill()}}


function drawTrace(c,t){
 const a=Math.max(0,.28*(1-t.age/7)),r=3.4+Math.sin(t.age*2)*.4;
 c.save();c.translate(t.x,t.y);c.globalAlpha=a;
 const variant=t.skin;
 if(variant===0){ // leaf
  c.rotate(-.55);c.fillStyle='#72be8c';c.beginPath();c.ellipse(0,0,r*.70,r*1.1,0,0,7);c.fill();
  c.strokeStyle='#4b9a68';c.lineWidth=.6;c.beginPath();c.moveTo(0,-r);c.lineTo(0,r);c.stroke();
 }else if(variant===1){ // sakura blossom
  c.fillStyle='#f68fb7';for(let j=0;j<5;j++){let an=j*Math.PI*2/5;c.beginPath();c.ellipse(Math.cos(an)*r*.56,Math.sin(an)*r*.56,r*.39,r*.57,an,0,7);c.fill()}
 }else if(variant===2){ // star from crown
  c.strokeStyle='#ddb158';c.lineWidth=1.1;c.beginPath();c.moveTo(0,-r*1.6);c.lineTo(0,r*1.6);c.moveTo(-r*1.6,0);c.lineTo(r*1.6,0);c.stroke();
 }else if(variant===3){ // dots
  c.fillStyle='#9bcfe2';for(let j=0;j<3;j++){c.beginPath();c.arc((j-1)*r*.9,Math.sin(j*2)*r*.5,r*.35,0,7);c.fill();}
 }else if(variant===4){ // paw
  c.fillStyle='#e9ab99';c.beginPath();c.ellipse(0,r*.35,r*.9,r*.65,0,0,7);c.fill();
  for(let j=-1;j<=1;j++){c.beginPath();c.arc(j*r*.7,-r*.7,r*.33,0,7);c.fill()}
 }else if(variant===5){ // hair curls
  c.strokeStyle='#ab8c86';c.lineWidth=.8;for(let j=-1;j<=1;j++){c.beginPath();c.moveTo(j*r*.7,-r);c.quadraticCurveTo((j+.4)*r*.7,0,j*r*.7,r);c.stroke()}
 }else if(variant===6){ // warm ember
  c.fillStyle='#f3b675';c.beginPath();c.moveTo(0,-r*1.4);c.quadraticCurveTo(-r*1.2,0,0,r);c.quadraticCurveTo(r*1.1,0,0,-r*1.4);c.fill();
 }else if(variant===7){ // water drop
  c.fillStyle='#8dd0f1';c.beginPath();c.moveTo(0,-r*1.5);c.bezierCurveTo(-r*.85,-r*.1,-r*.85,r,0,r);c.bezierCurveTo(r*.85,r,r*.85,-r*.1,0,-r*1.5);c.fill();
 }else if(variant===8){ // tiny plush heart
  c.fillStyle='#d1b2ec';c.beginPath();c.moveTo(0,r*1.2);c.bezierCurveTo(-r*1.8,0,-r*.65,-r*1.2,0,-r*.25);c.bezierCurveTo(r*.65,-r*1.2,r*1.8,0,0,r*1.2);c.fill();
 }else{c.fillStyle='#bee6ba';c.beginPath();c.arc(0,0,r,0,7);c.fill()}
 c.restore();
}
function paint(){
 ctx.clearRect(0,0,cvs.width,cvs.height);ctx.save();ctx.scale(3,3);
 for(const p of petals.filter(p=>p.settled))drawPetal(ctx,p.x,p.y,p.size,-.3,.45);
 for(const tr of traces)drawTrace(ctx,tr);
 for(const b of bodies)sprite(ctx,b.kind,b.x,b.y,r(b),b.angle,b.impact,1,b);
 for(const f of fusions){
  const t=Math.min(1,f.age/.32),e=1-(1-t)*(1-t);
  for(const p of f.parts)sprite(ctx,p.kind,p.x+(f.x-p.x)*e,p.y+(f.y-p.y)*e,p.radius*(1-t*.66),p.angle+t*.3,0,Math.max(0,1-t*.95));
 }
 for(const p of puffs)cloud(ctx,p);
 for(const p of petals.filter(p=>!p.settled))drawPetal(ctx,p.x,p.y,p.size,.5+Math.sin(p.age*2)*.8,.7);
 ctx.restore();status.firstChild.textContent='⭐ '+points+'　';document.getElementById('inGameCoins').textContent=coins;
 const n=playing&&active?.held&&heldFor>=2?Math.max(1,3-Math.floor(heldFor-2)):0;
 count.textContent=n||'';count.style.display=n?'block':'none';
 feedback.textContent=(!playing||msgAge<1.5)?message:'';
}
let lastHomeDraw=0;
function loop(ts){paintTime=ts/1000;if(playing&&ts-lastSavedAt>1900){save();lastSavedAt=ts;}if(!last)last=ts;
if(ts-lastHomeDraw>=85&&document.getElementById('home').style.display!=='none'){drawHome();lastHomeDraw=ts;}const dt=Math.min(.06,(ts-last)/1000);last=ts;if(playing&&!tutorialOpen){acc+=dt*speedChoice;let n=0;while(acc>=1/120&&n<8){simulate(1/120);acc-=1/120;n++}}updateLevel();paint();requestAnimationFrame(loop)}requestAnimationFrame(loop);

function renderCards(where){
 const shop=where==='shop',root=document.getElementById(shop?'shopCards':'collectionCards');
 root.textContent='';
 skins.forEach((sk,i)=>{
  if(shop&&i<3)return;if(!shop&&!unlocked.includes(i))return;
   if(i===HALLOWEEN_SKIN_INDEX&&!halloweenActive()&&shop)return;
  const owned=unlocked.includes(i),chosen=selected===i,card=document.createElement('div');
   const seasonal=i===HALLOWEEN_SKIN_INDEX,price=skinPrice(i),canBuy=canPurchaseSkin(i);
  card.className='skinCard'+(chosen?' selected':'')+(owned?'':' locked')+(seasonal?' seasonalCard':'');
  const picture=document.createElement('canvas');picture.width=240;picture.height=240;
   if(seasonal){
     const wrap=document.createElement('div');wrap.className='seasonFigure';
     const ribbon=document.createElement('div');ribbon.className='seasonRibbon';ribbon.textContent='🎃 '+tr.season;
     wrap.appendChild(ribbon);wrap.appendChild(picture);card.appendChild(wrap);
     const mark=document.createElement('strong');mark.className='seasonTag';mark.textContent='🎃 '+tr.skinNames[i];
     const info=document.createElement('small');info.textContent=tr.seasonDesc;mark.appendChild(info);card.appendChild(mark);
   }else card.appendChild(picture);
   const button=document.createElement('button');
  if(owned){button.textContent=chosen?'✓':'✓';button.className='owned'+(chosen?' selected':'')}
  else {const coin=document.createElement('span');coin.className='pepperCoin';button.appendChild(coin);
   const value=document.createElement('span');value.textContent=canBuy?price:tr.notAvailable;button.appendChild(value)}
  button.setAttribute('aria-label',owned?tr.owned+' '+tr.skinNames[i]:canBuy?tr.buy+' '+tr.skinNames[i]+' '+price+' '+tr.candy:tr.notAvailable+' '+tr.skinNames[i]);
  button.disabled=chosen||(!shop&&!owned)||(shop&&!owned&&(!canBuy||coins<price));
  button.onclick=()=>{if(owned){selected=i;save();refreshViews()}
   else if(shop&&canPurchaseSkin(i)&&coins>=skinPrice(i)){coins-=skinPrice(i);unlocked.push(i);selected=i;save();refreshViews()}};
  card.appendChild(button);root.appendChild(card);
  const c=picture.getContext('2d');c.clearRect(0,0,240,240);
  if(finalAtlasReady&&i<9){asset(c,i===0?4:(i<=2?i+4:i+4),120,124,196)}else sprite(c,7,120,130,73,0,0,1,{id:i+16,skin:i});
 });
}
function refreshViews(){refreshWallet();drawHome();renderCards('shop');renderCards('collection')}
function updateHalloweenCountdown(){
 const remaining=HALLOWEEN_END_UTC-Date.now(),available=remaining>0;
 const banner=document.getElementById('halloweenSeasonBanner'),shopNote=document.getElementById('seasonShopNote');
 banner.hidden=!available;
 if(available){
   const secs=Math.max(0,Math.ceil(remaining/1000)),day=Math.floor(secs/86400),hour=Math.floor(secs%86400/3600),minute=Math.floor(secs%3600/60),sec=secs%60;
   const dayWord=language==='pl'?(day===1?'dzień':'dni'):
     language==='cs'?(day===1?'den':day>=2&&day<=4?'dny':'dní'):
     language==='en'?(day===1?'day':'days'):
     language==='de'?(day===1?'Tag':'Tage'):(day===1?'día':'días');
   const parts=[day+' '+dayWord,hour+' '+tr.timeUnits[1],minute+' '+tr.timeUnits[2],sec+' '+tr.timeUnits[3]].join(' · ');
   document.getElementById('halloweenSeasonBanner').setAttribute('aria-label',tr.seasonBadge);
   document.getElementById('seasonHeading').textContent='🎃 '+tr.seasonBadge+' ✨';
   document.getElementById('seasonSub').textContent=tr.seasonDesc;
   document.getElementById('seasonShopBtn').textContent=tr.seasonShop;
   document.getElementById('seasonCountdownValue').textContent='⏳ '+parts;
   shopNote.textContent='🎃 '+tr.seasonDeadline+' · '+tr.seasonCountdown+': '+parts;
 }else shopNote.textContent='';
 if(countdownExpired!==!available){countdownExpired=!available;renderCards('shop')}
}

 window.squishyPlayUpdateAvailable=()=>{
  document.getElementById('playUpdateBanner').style.display='flex';

  document.getElementById('playUpdateNow').textContent=tr.update;

 };

}

function showPage(page){
 for(const [id,key] of [['home','home'],['game','game'],['collectionScreen','collection'],['shopScreen','shop']])
  document.getElementById(id).style.display=key===page?'block':'none';
 if(page!=='game'){if(playing)save();playing=false;}
 if(page==='shop'||page==='collection')refreshViews();
}
document.querySelector('#play').onclick=()=>{showPage('game');if(!resumeRun())reset();if(!tutorialSeen)openTutorial()};
document.querySelector('#restart').onclick=reset;
document.querySelector('#back').onclick=()=>showPage('home');
document.querySelector('#openCollection').onclick=()=>showPage('collection');
document.querySelector('#openShop').onclick=()=>showPage('shop');
 document.getElementById('seasonShopBtn').onclick=()=>showPage('shop');
document.querySelector('#collectionBack').onclick=()=>showPage('home');
document.querySelector('#shopBack').onclick=()=>showPage('home');
document.querySelectorAll('#speedControls [data-speed]').forEach(btn=>btn.onclick=()=>{speedChoice=Number(btn.dataset.speed);refreshSpeedControls();save()});
document.getElementById('tutorialOpenBtn').onclick=openTutorial;
document.getElementById('tutorialSkip').onclick=closeTutorial;
document.getElementById('tutorialNext').onclick=()=>{if(tutorialStep===ux.steps.length-1)closeTutorial();else{tutorialStep++;renderTutorial()}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)save()});
window.addEventListener('pagehide',()=>{if(playing)save()});
let lastSavedAt=0;
const originalLoop=loop; // periodic autosave is handled in game paint callback below
loadSave();applyLanguage();refreshSpeedControls();refreshViews();updateLevel();wirePlayUpdateNotice();updateHalloweenCountdown();setInterval(updateHalloweenCountdown,1000);
})();
