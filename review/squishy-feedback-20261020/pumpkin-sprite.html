<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Squishy Merge — Pumpkin Costume</title><style>:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#745b85}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;padding:13px;background:radial-gradient(circle at 18% 10%,#fff2ce,transparent 43%),linear-gradient(#ffecf5,#f0e4ff);display:grid;place-items:center}
main{width:min(100%,520px);border:3px solid white;background:linear-gradient(150deg,#fffaf1,#ffe3bd 54%,#fbe6ff);box-shadow:0 12px 40px #bd93b94d;border-radius:30px;padding:18px 16px;text-align:center}
.tag{display:inline-block;border-radius:30px;padding:6px 13px;background:#a26db4;color:#fff;font-size:11px;font-weight:900;letter-spacing:1px}
h1{font-size:clamp(21px,5vw,28px);margin:12px 0 4px;color:#995b90}p{font-size:13px;line-height:1.5;margin:5px 0 12px}
.stage{background:radial-gradient(circle at 50% 45%,#fffdf5 0%,#ffe3bb 63%,#ffd1bb 100%);border:3px solid white;border-radius:23px;box-shadow:inset 0 0 20px #d4a5982a;overflow:hidden}
canvas{width:100%;height:auto;display:block;aspect-ratio:1}
.comparison{display:grid;grid-template-columns:1fr 2fr;gap:9px;align-items:end;max-width:440px;margin:0 auto}
.comparison .stage{padding:4px}
.smallTitle{font-size:11px;font-weight:900;color:#967497;padding:6px 0 2px}
.price{font-size:20px;font-weight:900;color:#a56c8c;margin-top:10px}
a{margin-top:11px;display:inline-block;background:#94cdaa;border-radius:14px;padding:12px 15px;font-size:13px;font-weight:900;text-decoration:none;color:#44715a}
.note{font-size:11px;color:#897e95;line-height:1.35;margin-top:9px}</style></head><body><main>
<div class="tag">🎃 HALLOWEEN SEASON</div><h1 id="title"></h1><p id="intro"></p>
<div class="comparison"><div><div id="fromName" class="smallTitle"></div><div class="stage"><canvas id="original" width="320" height="350"></canvas></div></div>
<div><div id="toName" class="smallTitle"></div><div class="stage"><canvas id="costume" width="480" height="500"></canvas></div></div></div>
<div id="price" class="price"></div><div id="note" class="note"></div><a id="back" href="./"></a>
</main><script>
(()=>{'use strict';
const words={"pl":["Dyniowy Squishy","To ten sam kremowy Squishy 3D co w grze, tylko przebrany w miękki kostium dyni.","Oryginał","Kostium Halloween","Za postać: 100 cukierków","Porównanie rysowane tym samym silnikiem sprite’ów co w grze.","← Wróć do gry"],"en":["Pumpkin Squishy","The exact same cream 3D Squishy from the game, now wearing a soft pumpkin costume.","Original","Halloween costume","Character price: 100 candies","Both characters use the game's real sprite renderer.","← Back to the game"],"de":["Kürbis-Squishy","Derselbe cremefarbene 3D-Squishy wie im Spiel – nur im weichen Kürbiskostüm.","Original","Halloween-Kostüm","Preis: 100 Bonbons","Beide Figuren werden vom originalen Sprite-Renderer gezeichnet.","← Zurück zum Spiel"],"es":["Squishy Calabaza","El mismo Squishy 3D color crema del juego, pero vestido con un suave disfraz de calabaza.","Original","Disfraz de Halloween","Precio: 100 caramelos","Ambos personajes se dibujan con el motor de sprites original.","← Volver al juego"],"cs":["Dýňový Squishy","Stejný krémový 3D Squishy ze hry, jen oblečený do měkkého dýňového kostýmu.","Originál","Halloweenský kostým","Cena: 100 bonbonů","Obě postavičky vykresluje stejný herní sprite engine.","← Zpět do hry"]};
const lang=(navigator.language||'en').toLowerCase().split(/[-_]/)[0];
const entries=words[lang]||words.en;
document.documentElement.lang=words[lang]?lang:'en';
['title','intro','fromName','toName','price','note','back'].forEach((id,i)=>document.getElementById(id).textContent=entries[i]);
const pastel=['#c7adf5','#ffb6c9','#ffc79d','#dfb79c','#c3e5ad'];
const skins=[
 ['Listek','#b7e8a5','leaf'],['Kwiatek','#ffc2df','flower'],['Korona','#dcc7ff','crown'],
 ['Kropeczki','#b2e1e8','dots'],['Kocie uszy','#ffdbab','cat'],['Trzy włoski','#ebc3b0','hair'],
 ['Płomyk','#ffc5a6','flame'],['Fontanna','#bde2fa','fountain'],['Pluszak','#d2c6f2','plush'],
 ['Gwiazdka','#ffe7ac','star'],['Panda','#e0d7f6','panda'],['Chmurka','#cbeeff','cloud'],['Dyniowy Squishy','#ffa44d','pumpkin']
];
const HALLOWEEN_SKIN_INDEX=12, GAME_ASSETS=[0,1,2,3,4,5,6];
let selected=12,paintTime=0,finalAtlasReady=false;
const finalAtlas=new Image();
finalAtlas.onload=()=>{finalAtlasReady=true};
fetch('../squishy-3d/assets/squishy-final-precise.b64')
 .then(r=>{if(!r.ok)throw new Error('Missing atlas');return r.text()})
 .then(data=>{finalAtlas.src='data:image/webp;base64,'+data.trim()})
 .catch(()=>{finalAtlas.src='../squishy-3d/assets/squishy-assets-v5.webp'});
function asset(c,index,x,y,size){
 if(!finalAtlasReady)return false;
 const cell=192,col=index%5,row=Math.floor(index/5);
 c.drawImage(finalAtlas,col*cell,row*cell,cell,cell,x-size/2,y-size/2,size,size);
 return true;
}

function mochiPath(c,r){
 c.beginPath();c.moveTo(-r*.82,r*.29);c.bezierCurveTo(-r*1.06,-r*.23,-r*.84,-r*.75,-r*.43,-r*.78);
 c.bezierCurveTo(-r*.2,-r*.83,-r*.22,-r*1.12,0,-r*1.09);
 c.bezierCurveTo(r*.22,-r*1.08,r*.2,-r*.83,r*.44,-r*.78);
 c.bezierCurveTo(r*.89,-r*.74,r*1.08,-r*.22,r*.84,r*.3);
 c.bezierCurveTo(r*.65,r*.91,-r*.66,r*.91,-r*.82,r*.29);c.closePath();
}

function decoration(c,skin,r){
 const sk=skins[skin];if(!sk)return;const type=sk[2];c.save();c.lineCap='round';
 if(type==='dots'){c.fillStyle='#fff9';for(const [x,y] of [[-.55,-.33],[.53,-.4],[.59,.38],[-.55,.35]]){c.beginPath();c.arc(r*x,r*y,r*.065,0,7);c.fill();}}
 if(type==='leaf'){for(const s of [-1,1]){c.fillStyle=s<0?'#78c39d':'#8ac96f';c.beginPath();c.ellipse(s*r*.2,-r*.99,r*.16,r*.3,s*.6,0,7);c.fill()}}
 if(type==='flower'){c.translate(r*.36,-r*.85);for(let j=0;j<5;j++){c.save();c.rotate(j*Math.PI*2/5);c.fillStyle='#ff8bb9';c.beginPath();c.ellipse(0,-r*.14,r*.105,r*.17,0,0,7);c.fill();c.restore()}c.fillStyle='#fff19d';c.beginPath();c.arc(0,0,r*.09,0,7);c.fill()}
 if(type==='crown'){c.fillStyle='#ffe18c';c.strokeStyle='#dba95a';c.lineWidth=r*.035;c.beginPath();c.moveTo(-r*.44,-r*.77);c.lineTo(-r*.43,-r*1.14);c.lineTo(-r*.18,-r*.96);c.lineTo(0,-r*1.24);c.lineTo(r*.18,-r*.96);c.lineTo(r*.44,-r*1.14);c.lineTo(r*.44,-r*.77);c.closePath();c.fill();c.stroke()}
 if(type==='cat'){for(const s of [-1,1]){c.fillStyle='#ffdfb4';c.beginPath();c.moveTo(s*r*.16,-r*.89);c.lineTo(s*r*.52,-r*1.2);c.lineTo(s*r*.64,-r*.73);c.closePath();c.fill();c.fillStyle='#f5a0b4';c.beginPath();c.moveTo(s*r*.3,-r*.92);c.lineTo(s*r*.51,-r*1.10);c.lineTo(s*r*.56,-r*.85);c.fill()}}
 if(type==='hair'){c.strokeStyle='#403044';c.lineWidth=r*.045;for(let j=-1;j<=1;j++){let x=j*r*.17;c.beginPath();c.moveTo(x,-r*.76);c.quadraticCurveTo(x-r*.06,-r*1.08,x+r*.07,-r*1.12);c.stroke()}}
 if(type==='flame'){c.fillStyle='#ffa04d';c.beginPath();c.moveTo(-r*.21,-r*.78);c.quadraticCurveTo(-r*.29,-r*1.03,r*.08,-r*1.31);c.quadraticCurveTo(r*.11,-r*1.08,r*.25,-r*1.07);c.quadraticCurveTo(r*.38,-r*.76,0,-r*.74);c.fill();c.fillStyle='#ffe18d';c.beginPath();c.ellipse(0,-r*.91,r*.1,r*.15,0,0,7);c.fill()}
 if(type==='fountain'){c.strokeStyle='#8dcaee';c.lineWidth=r*.046;for(const s of [-1,0,1]){c.beginPath();c.moveTo(0,-r*.78);c.quadraticCurveTo(s*r*.3,-r*1.44,s*r*.47,-r*1.2);c.stroke();c.fillStyle='#c1f2fa';c.beginPath();c.ellipse(s*r*.47,-r*1.2,r*.06,r*.1,0,0,7);c.fill()}}
 if(type==='star'){c.fillStyle='#ffca63';c.strokeStyle='#fff5c0';c.lineWidth=r*.035;c.beginPath();for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,rd=j%2?r*.13:r*.28;c.lineTo(Math.cos(a)*rd,Math.sin(a)*rd-r*.94)}c.closePath();c.fill();c.stroke()}
 if(type==='panda'){for(const s of [-1,1]){c.fillStyle='#766284';c.beginPath();c.arc(s*r*.58,-r*.80,r*.26,0,Math.PI*2);c.fill();c.fillStyle='#f8dcf0';c.beginPath();c.arc(s*r*.58,-r*.8,r*.12,0,Math.PI*2);c.fill()}}
 if(type==='cloud'){c.fillStyle='#fffdf8';for(const [x,y,sz] of [[-.26,-.92,.23],[0,-1.06,.3],[.30,-.92,.22]]){c.beginPath();c.arc(r*x,r*y,r*sz,0,Math.PI*2);c.fill()}}
 if(type==='pumpkin'){
   c.lineCap='round';c.strokeStyle='#db6f36';c.lineWidth=r*.065;
   for(const v of [-.43,.43]){c.beginPath();c.moveTo(v*r*.82,-r*.55);c.bezierCurveTo(v*r*1.1,-r*.06,v*r*.92,r*.34,v*r*.71,r*.60);c.stroke()}
   c.fillStyle='#65bc68';c.beginPath();c.moveTo(-r*.13,-r*.93);c.lineTo(-r*.08,-r*1.40);c.quadraticCurveTo(r*.18,-r*1.48,r*.18,-r*1.27);c.lineTo(r*.12,-r*.91);c.closePath();c.fill();
   c.fillStyle='#7ddc83';c.beginPath();c.ellipse(r*.28,-r*1.25,r*.30,r*.12,-.38,0,Math.PI*2);c.fill();
  }
  if(type==='plush'){c.strokeStyle='#ffffffb9';c.lineWidth=r*.045;c.setLineDash([r*.07,r*.1]);c.beginPath();c.arc(0,0,r*.77,0,Math.PI);c.stroke();c.setLineDash([]);c.fillStyle='#ffa9d1';c.beginPath();c.ellipse(0,r*.56,r*.31,r*.12,0,0,7);c.fill()}
 c.restore();
}

function face(c,r,b){
 // Eyes and mouth share the mochi's transform, so they never drift.
 const t=paintTime+(b?.id||0)*.77,period=3.45+((b?.id||0)%5)*.33,phase=t%period;
 const blink=phase<.16?Math.sin(phase/.16*Math.PI):0,ey=r*.07,ex=r*.28,er=r*.087;
 c.save();c.lineCap='round';for(const s of [-1,1]){
  const x=s*ex;if(blink>.12){c.strokeStyle='#51394f';c.lineWidth=Math.max(1.2,r*.052);c.beginPath();c.moveTo(x-er*1.3,ey);c.quadraticCurveTo(x,ey+er*.8,x+er*1.3,ey);c.stroke();}
  else{c.fillStyle='#463549';c.beginPath();c.ellipse(x,ey,er,er*1.18,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x-er*.25+Math.sin(t*1.2)*r*.017,ey-er*.30,er*.27,0,7);c.fill();}
  c.fillStyle='#f49db6a3';c.beginPath();c.ellipse(s*r*.5,r*.26,r*.14,r*.08,0,0,7);c.fill();}
 const open=.5+.5*Math.sin(t*2.6);c.strokeStyle='#633f55';c.lineWidth=Math.max(1.2,r*.052);c.lineCap='round';
 if(open>.61){c.fillStyle='#a7536d';c.beginPath();c.ellipse(0,r*.38,r*.125,r*(.06+.04*open),0,0,7);c.fill();c.fillStyle='#ff99b0';c.beginPath();c.ellipse(0,r*.43,r*.06,r*.025,0,0,7);c.fill()}
 else{c.beginPath();c.moveTo(-r*.13,r*.34);c.quadraticCurveTo(0,r*.49,r*.13,r*.34);c.stroke()}
 c.restore();
}

function special(c,kind,r){
 if(kind===-2){c.fillStyle='#fff7ed';c.beginPath();c.arc(0,0,r*.93,0,7);c.fill();c.save();c.beginPath();c.arc(0,0,r*.9,0,7);c.clip();c.rotate(-.4);for(let i=-5;i<=5;i++){c.fillStyle=i%2?'#f37285':'#fff8f0';c.fillRect(i*r*.35,-r,r*.35,2*r)}c.restore();c.strokeStyle='#edb7b6';c.lineWidth=1.4;c.beginPath();c.arc(0,0,r*.9,0,7);c.stroke();}
 else if(kind===-1){let g=c.createConicGradient(paintTime,0,0);['#f3b1dc','#fff0a9','#b4f1d2','#b9d2ff','#d6bfff','#f3b1dc'].forEach((color,i)=>g.addColorStop(i/5,color));c.fillStyle=g;c.beginPath();c.arc(0,0,r*.9,0,7);c.fill();face(c,r,{id:3})}
 else{const g=c.createRadialGradient(-r*.4,-r*.4,1,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#a5d7ec77');c.fillStyle=g;c.beginPath();c.arc(0,0,r*.9,0,7);c.fill();}
}

function livingFace(c,kind,radius,b){
 // The original eyes and mouth already belong to the illustration.
 // Animate only tiny highlights INSIDE them: no extra displaced eye or mouth.
 const id=b.id||0,t=paintTime+id*.57;
 const blinking=(t%(4.1+(id%4)*.42))<.15;
 const anchors={
  0:[], 1:[[-.31,.25]],2:[[-.30,.24],[.29,.24]],3:[],
  4:[[-.28,.22],[.29,.22]],5:[[-.29,.23],[.29,.23]]
 };
 const eyes=anchors[kind]||[];
 c.save();
 // Narrow pearly glints shift on existing eyes, never painting new pupils.
 for(const [ex,ey] of eyes){
  c.fillStyle='rgba(255,255,255,.72)';
  c.beginPath();
  c.ellipse((ex-.055+Math.sin(t*.9)*.015)*radius,(ey-.09)*radius,
    radius*.022,radius*.033,0,0,Math.PI*2);c.fill();
 }
 // A micro glint within the already-printed mouth reads as a lively smile.
 if((kind!==3)&&!blinking){
  c.fillStyle='rgba(255,205,220,.28)';
  c.beginPath();c.ellipse(0,radius*.48,radius*.070,radius*.014,0,0,Math.PI*2);c.fill();
 }
 c.restore();
}

function drawPumpkinCostume(c,r){
 c.save();
 const shell=c.createLinearGradient(-r*.95,-r*.95,r*.95,r*.85);
 shell.addColorStop(0,'#ffe2a0');shell.addColorStop(.26,'#ffb459');
 shell.addColorStop(.61,'#f98a43');shell.addColorStop(1,'#e57745');
 // Soft padded pumpkin hood: generous face opening lets the original eyes
 // and mouth shine through; it inherits the same bounce/rotation transform.
 c.beginPath();c.ellipse(0,r*.04,r*.93,r*.91,0,0,Math.PI*2);
 c.ellipse(0,r*.18,r*.66,r*.59,0,0,Math.PI*2,true);
 c.fillStyle=shell;c.fill('evenodd');
 c.lineWidth=r*.038;c.strokeStyle='rgba(255,241,190,.72)';
 c.beginPath();c.ellipse(0,r*.18,r*.66,r*.59,0,0,Math.PI*2);c.stroke();
 // Pumpkin seams in the orange padded shell, outside the exposed face.
 c.lineCap='round';
 for(const side of [-1,1]){
  c.strokeStyle=side===-1?'rgba(189,89,39,.42)':'rgba(255,235,168,.83)';
  c.lineWidth=r*.052;
  c.beginPath();
  c.moveTo(side*r*.54,-r*.61);
  c.bezierCurveTo(side*r*.92,-r*.29,side*r*.91,r*.44,side*r*.54,r*.70);
  c.stroke();
 }
 // Glossy cap and stitched green stem.
 c.fillStyle='#ffcf75';c.beginPath();c.ellipse(-r*.37,-r*.58,r*.17,r*.07,-.6,0,Math.PI*2);c.fill();
 c.fillStyle='#4d9c5a';c.strokeStyle='#2f7a51';c.lineWidth=r*.026;
 c.beginPath();c.moveTo(-r*.10,-r*.76);c.lineTo(-r*.06,-r*1.19);
 c.quadraticCurveTo(r*.06,-r*1.38,r*.18,-r*1.20);
 c.lineTo(r*.12,-r*.76);c.closePath();c.fill();c.stroke();
 const leaf=c.createLinearGradient(0,-r*1.35,r*.57,-r*.97);
 leaf.addColorStop(0,'#a1e180');leaf.addColorStop(1,'#62b46d');
 c.fillStyle=leaf;c.beginPath();c.moveTo(r*.04,-r*1.06);
 c.quadraticCurveTo(r*.25,-r*1.43,r*.59,-r*1.27);
 c.quadraticCurveTo(r*.40,-r*.92,r*.04,-r*1.06);c.fill();
 c.strokeStyle='#3e965e';c.lineWidth=r*.019;c.beginPath();
 c.moveTo(r*.06,-r*1.06);c.lineTo(r*.45,-r*1.25);c.stroke();
 // Small satin bow/stitch at the collar; still unmistakably a Squishy.
 c.fillStyle='#f8d79c';c.beginPath();c.ellipse(0,r*.78,r*.20,r*.08,0,0,Math.PI*2);c.fill();
 c.restore();
}

function sprite(c,kind,x,y,radius,angle=0,impact=0,opacity=1,b=null){
 c.save();c.translate(x,y+(b?.held?Math.sin(paintTime*3+b.id)*.8:0));c.rotate(angle);
 const w=b?.squish||0,m=b?.morph||0;const breath=b?.held?Math.sin(paintTime*2+(b?.id||0))*.014:Math.sin(paintTime*1.8+(b?.id||0))*.007;const scale=1-m*.28+Math.sin((1-m)*Math.PI)*m*.10+breath;
 c.scale(scale*(1+w*.17+impact*.06),scale*(1-w*.12-impact*.10));c.globalAlpha=opacity;
 c.shadowColor='#7055814f';c.shadowBlur=radius*.22;c.shadowOffsetY=radius*.12;
 if(kind===-2){if(!asset(c,13,0,0,radius*2.20))special(c,kind,radius);c.restore();return;}
 if(kind<0){special(c,kind,radius);c.restore();return;}
 // Use the EXACT cream 3D Squishy sprite already in the game's final atlas.
 // The costume is drawn above it, not a replacement for its face.
 if(kind===7&&b?.skin===HALLOWEEN_SKIN_INDEX&&asset(c,3,0,0,radius*2.34)){
  drawPumpkinCostume(c,radius);c.restore();return;
 }
 // Every mochi on the board, including the small/medium stages, uses the real
 // transparent 3D assets. The same artwork is used in the upcoming-piece tray.
 const spriteIndex=kind===7
  ?(Number.isInteger(b?.skin)&&b.skin>=9?undefined:(Number.isInteger(b?.skin)&&b.skin>=3&&b.skin<9?b.skin+4:4))
  :GAME_ASSETS[kind];
 if(spriteIndex!==undefined&&asset(c,spriteIndex,0,0,radius*2.34)){
  if(b&&kind<=1)livingFace(c,kind,radius,b);
  c.restore();return;
 }
 const base=kind===7?(b?.skin===HALLOWEEN_SKIN_INDEX?'#ffe9d3':(skins[b?.skin??selected]?.[1]||'#b7e8a5')):(pastel[kind]||'#e8c2e8');
 function shade(f){return 'rgb('+[1,3,5].map(i=>{const a=parseInt(base.slice(i,i+2),16);return Math.round(a+(f>0?(255-a)*f:a*f))}).join(',')+')'}
 const grad=c.createRadialGradient(-radius*.41,-radius*.55,1,0,radius*.15,radius*1.37);
 grad.addColorStop(0,shade(.69));grad.addColorStop(.38,shade(.33));grad.addColorStop(.75,base);grad.addColorStop(1,shade(-.22));
 mochiPath(c,radius);c.fillStyle=grad;c.fill();c.shadowBlur=0;c.shadowOffsetY=0;
 c.strokeStyle='#ffffff85';c.lineWidth=radius*.025;c.stroke();
 c.strokeStyle='#ffffff7f';c.lineWidth=radius*.048;c.lineCap='round';
 for(const j of [-2,-1,1,2]){c.beginPath();c.moveTo(j*radius*.055,-radius*.96);c.quadraticCurveTo(j*radius*.20,-radius*.66,j*radius*.22,-radius*.52);c.stroke();}
 c.fillStyle='#ffffff96';c.beginPath();c.ellipse(-radius*.39,-radius*.4,radius*.24,radius*.078,-.4,0,7);c.fill();
 if(kind===7&&b?.skin===HALLOWEEN_SKIN_INDEX){
  face(c,radius,b);drawPumpkinCostume(c,radius);
 }else{
  if(kind===7)decoration(c,b?.skin??selected,radius);
  face(c,radius,b);
 }
 c.restore();
}
function frame(now){
 paintTime=now/1000;
 const left=document.getElementById('original'),lc=left.getContext('2d');
 const right=document.getElementById('costume'),rc=right.getContext('2d');
 lc.clearRect(0,0,left.width,left.height);rc.clearRect(0,0,right.width,right.height);
 // Original cream Squishy: atlas cell 3 (same base used in the seasonal costume).
 lc.save();lc.translate(160,178);asset(lc,3,0,0,230);lc.restore();
 sprite(rc,7,240,276,150,0,0,1,{id:67,skin:HALLOWEEN_SKIN_INDEX});
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script></body></html>
