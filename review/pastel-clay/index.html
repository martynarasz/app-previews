<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Squishy Merge — 3D Fruits Preview</title>
<style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#665281;background:#f8effa}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 25% 5%,#fff1f6 0,#f6eefd 43%,#e8f6f4 100%);padding:18px 12px 30px}
main{max-width:500px;margin:auto;text-align:center}
h1{font-size:clamp(28px,7vw,39px);margin:4px 0 2px;letter-spacing:-1.2px;color:#6d568b}
small,.subtitle{color:#9784ad} .subtitle{font-size:13px;margin:5px 0 13px}
#hero{width:100%;max-width:425px;aspect-ratio:340/208;display:block;margin:3px auto 13px;border-radius:28px;filter:drop-shadow(0 13px 16px #9475ad23)}
#gameScreen{display:none} .hud{font-size:18px;font-weight:850;margin:8px 0 4px}.hint{color:#9987ae;font-size:12px;margin-bottom:8px}
#arena{width:100%;max-width:460px;aspect-ratio:360/465;display:block;border-radius:28px;background:linear-gradient(140deg,#fffafb,#f3eafc 52%,#e8f8f4);box-shadow:0 12px 30px #9075b53c;border:3px solid #fff;touch-action:none}
button{font-family:inherit;cursor:pointer;border:0;border-radius:19px;padding:15px 19px;font-size:16px;font-weight:850;transition:transform .1s;background:#9d86d8;color:white;box-shadow:0 6px 14px #9d86d843}
button:active{transform:scale(.96)}.actionRow{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:13px}.actionRow button{flex:1}
#start{width:95%;max-width:330px;background:#8dceb9}#restart{background:#eadbf7;color:#685385;box-shadow:none}
#message{font-weight:750;color:#9c70a9;font-size:13px;min-height:33px;margin:10px 0 4px}
.legend{font-size:12px;line-height:1.6;color:#8c79a6;margin:13px auto;max-width:420px}
#arenaWrap{position:relative}
#countdown{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:42px;font-size:clamp(64px,18vw,108px);font-weight:1000;color:#9273c6;pointer-events:none;text-shadow:0 5px 0 #ffffffaa,0 8px 25px #9a73b8a1;animation:pulse .45s ease-in-out}
@keyframes pulse{0%{transform:scale(.75);opacity:.45}65%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
#message:empty{display:none}

</style>
</head>
<body>
<main>
<section id="home">
<h1>🍓 Squishy Merge</h1>
<canvas id="hero" width="680" height="416" aria-label="Pastelowe plastelinowe kamyczki i poduszki"></canvas>
<button id="start">▶ GRAJ</button>
</section>
<section id="gameScreen">
<div class="hud" id="hud">⭐ 0</div>
<div id="arenaWrap"><canvas id="arena" width="720" height="930" aria-label="Interaktywna gra z miękkimi elementami"></canvas><div id="countdown" aria-live="off"></div></div>
<div id="message"></div>
<div class="actionRow"><button id="restart">↻ OD NOWA</button></div>
<button id="back" style="background:transparent;box-shadow:none;color:#917ba7;font-size:12px">← WRÓĆ DO MENU</button>
</section>
</main>
<script>
(function(){
'use strict';
const palette=['#9955e9','#ff5474','#ffa62d','#c67c48','#8ed966'];
const W=360,H=465,R1=22,R2=32,mochiRadii=[22,32,43,55,69],
  rad=a=>a.col===-3?11:a.col<0?R1:mochiRadii[a.col];
const mochiNames=['Fioletowy','Czerwony','Brokatowy','Brązowy','Zielony'];
const hero=document.getElementById('hero'),arena=document.getElementById('arena');
const h=hero.getContext('2d'),ctx=arena.getContext('2d');
let speed=1,items=[],puffs=[],current=null,aim=180,points=0,merges=0,accum=0,frame=0,last=0,playing=false,locked=false;
let nextId=0,roundDrops=0,rainbow=false,message='',heldFor=0,roofFor=0,petals=[],petalClock=0,candyClears=0,marblesReleased=0;
function hex(hex){return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16))}
function tint(color,f){const rgb=hex(color),r=rgb.map(v=>Math.round(v+(255-v)*f));return 'rgb('+r.join(',')+')'}
function darken(color,f){const rgb=hex(color),r=rgb.map(v=>Math.round(v*(1-f)));return 'rgb('+r.join(',')+')'}
function clay(c,x,y,r,big,angle,impact,opacity){
c.save();c.translate(x,y);c.rotate(angle||0);c.scale(1+(impact||0)*.06,1-(impact||0)*.10);c.globalAlpha=opacity===undefined?1:opacity;
c.shadowColor='#60487255';c.shadowBlur=big?18:9;c.shadowOffsetY=big?8:4;
const path=new Path2D();for(let i=0;i<=64;i++){const a=i*Math.PI*2/64-Math.PI/2;
const ripple=1+(big?.025:.013)*Math.sin(a*(big?7:5));
let px=Math.cos(a)*r*.94*ripple,py=Math.sin(a)*r*.94*ripple;
i===0?path.moveTo(px,py):path.lineTo(px,py)}path.closePath();
let grad=c.createRadialGradient(-r*.38,-r*.43,r*.07,0,0,r*1.45);
grad.addColorStop(0,tint(palette[c._col||0],.67));grad.addColorStop(.37,tint(palette[c._col||0],.39));grad.addColorStop(.72,palette[c._col||0]);grad.addColorStop(1,darken(palette[c._col||0],.20));
c.fillStyle=grad;c.fill(path);c.shadowBlur=0;c.shadowOffsetY=0;if(c._col>=0)fruitSkin(c,r,c._col);c.strokeStyle='#ffffff55';c.lineWidth=big?2.1:1.6;c.stroke(path);
c.fillStyle='#ffffff56';c.beginPath();c.ellipse(-r*.32,-r*.45,r*.31,r*.105,-.12,0,Math.PI*2);c.fill();
if(big){c.strokeStyle='#ffffff60';c.lineWidth=1.7;c.beginPath();c.ellipse(0,0,r*.77,r*.75,0,.2,Math.PI*.80);c.stroke()}
c.fillStyle='#554366';for(const k of [-.26,.26]){
c.beginPath();c.ellipse(k*r,.015*r,r*.075,r*.104,0,0,Math.PI*2);c.fill();
c.fillStyle='#fff';c.beginPath();c.arc(k*r-r*.019,-.038*r,r*.035,0,Math.PI*2);c.fill();c.fillStyle='#554366';
c.fillStyle='#ee86aa99';c.beginPath();c.ellipse(k*r*1.9,r*.23,r*.13,r*.073,0,0,Math.PI*2);c.fill();c.fillStyle='#554366'}
c.strokeStyle='#554366';c.lineWidth=r*.085;c.lineCap='round';c.beginPath();c.moveTo(-r*.14,r*.24);c.quadraticCurveTo(0,r*.42,r*.14,r*.24);c.stroke();c.restore()}

function rainbowToy(c,item,opacity){
const t=performance.now()/1000,r=rad(item),pulse=1+Math.sin(t*5)*.09;
c.save();c.translate(item.x,item.y);c.rotate(item.a||0);c.scale(pulse,pulse);c.globalAlpha=opacity===undefined?1:opacity;
const grad=c.createConicGradient(t*.8,0,0);
['#ff99bc','#ffe18f','#8ce8c1','#9acafa','#ccadff','#ff99bc'].forEach((x,i)=>grad.addColorStop(i/5,x));
c.shadowColor='#c59cecaa';c.shadowBlur=18+Math.sin(t*5)*6;c.fillStyle=grad;
c.beginPath();c.arc(0,0,r*.94,0,Math.PI*2);c.fill();c.shadowBlur=0;
c.fillStyle='#ffffff9f';c.beginPath();c.ellipse(-r*.27,-r*.45,r*.30,r*.12,-.2,0,Math.PI*2);c.fill();
c.fillStyle='#58466f';for(const x of [-r*.23,r*.23]){c.beginPath();c.ellipse(x,-r*.01,r*.08,r*.10,0,0,Math.PI*2);c.fill()}
c.strokeStyle='#58466f';c.lineWidth=2;c.beginPath();c.arc(0,r*.12,r*.15,0,Math.PI);c.stroke();
c.restore();
}
function glassBall(c,r,seed){
const col=['#bbf4cc','#ffc9e6','#d6bafa','#ffe3a2','#a4d2ff'][Math.abs(seed)%5];
const g=c.createRadialGradient(-r*.43,-r*.40,0,0,0,r*1.33);
g.addColorStop(0,'white');g.addColorStop(.30,tint(col,.6));g.addColorStop(.73,col);g.addColorStop(1,darken(col,.36));
c.shadowColor='#ffffff99';c.shadowBlur=r*.5;c.fillStyle=g;
c.beginPath();c.arc(0,0,r,0,7);c.fill();c.shadowBlur=0;
c.strokeStyle='#ffffffcd';c.lineWidth=Math.max(.9,r*.06);
c.beginPath();c.arc(0,0,r*.90,0,7);c.stroke();
c.fillStyle='#ffffffd0';c.beginPath();c.ellipse(-r*.30,-r*.43,r*.30,r*.13,-.1,0,7);c.fill();
}
function fruitSkin(c,r,col){
c.save();c.beginPath();c.arc(0,0,r*.91,0,7);c.clip();
if(col===0){
for(let i=0;i<48;i++){const a=i*2.4,d=Math.sqrt((i+.5)/48)*r*.83;
c.fillStyle='#e5caff88';c.beginPath();c.arc(Math.cos(a)*d,Math.sin(a)*d,r*.017,0,7);c.fill()}
}
if(col===1){
c.strokeStyle='#ffe1f0ae';c.lineWidth=r*.23;c.lineCap='round';
for(let k=-3;k<=3;k++){const y=k*r*.56;c.beginPath();
c.moveTo(-r*1.3,y+r*.75);c.lineTo(r*1.3,y-r*.75);c.stroke()}
}
if(col===2){
for(let i=0;i<68;i++){const a=i*2.4,d=Math.sqrt((i+.5)/68)*r*.85;
c.fillStyle=i%3?'#ffe4a1bb':'#ffffffe5';
c.beginPath();c.arc(Math.cos(a)*d,Math.sin(a)*d,r*(i%6===0?.030:.015),0,7);c.fill()}
}
if(col===3){
c.strokeStyle='#ffe4b28d';c.lineWidth=r*.07;
for(let i=-2;i<=2;i++){c.beginPath();c.ellipse(i*r*.30,-r*.10,r*.17,r*.85,0,3.1,5.5);c.stroke()}
}
if(col===4){
c.fillStyle='#c9fbaa8f';c.beginPath();c.ellipse(0,r*.25,r*.84,r*.59,0,0,7);c.fill();
for(let i=0;i<17;i++){const a=i*2.4,d=r*(.13+(i%5)*.125);
c.save();c.translate(Math.cos(a)*d,r*.24+Math.sin(a)*d*.72);
glassBall(c,r*(.07+i%3*.016),i);c.restore()}
}
c.restore();
}
function fruitCandyDetail(c,item){
if(item.col<0)return;
const r=rad(item);c.save();c.translate(item.x,item.y);c.rotate(item.a||0);
const t=new Path2D();t.moveTo(-r*.38,-r*.76);
t.quadraticCurveTo(-r*.25,-r*1.10,-r*.10,-r*.96);
t.quadraticCurveTo(0,-r*1.25,r*.10,-r*.96);
t.quadraticCurveTo(r*.25,-r*1.10,r*.38,-r*.76);
t.quadraticCurveTo(0,-r*.64,-r*.38,-r*.76);
const col=['#b07afb','#ff81a1','#ffd366','#e6a16e','#b9f185'][item.col];
const g=c.createLinearGradient(-r*.3,-r*1.17,r*.3,-r*.69);
g.addColorStop(0,'#fff');g.addColorStop(.4,col);g.addColorStop(1,darken(col,.19));
c.fillStyle=g;c.fill(t);c.strokeStyle='#ffffff99';c.lineWidth=1.1;c.stroke(t);
for(let j=-2;j<=2;j++){c.strokeStyle='#ffffff7a';c.lineWidth=1.3;c.beginPath();
c.moveTo(j*r*.12,-r*1.01);c.lineTo(j*r*.14,-r*.76);c.stroke()}
if(item.col===3){
c.strokeStyle='#459a52';c.lineWidth=r*.085;c.lineCap='round';
c.beginPath();c.ellipse(0,-r*.76,r*.5,r*.15,0,0,Math.PI);c.stroke();
for(const sign of [-1,1]){c.beginPath();c.moveTo(0,-r*.76);
c.bezierCurveTo(sign*r*.55,-r*1.19,sign*r*.61,-r*.55,0,-r*.76);c.stroke()}
c.beginPath();c.moveTo(0,-r*.76);c.lineTo(r*.38,-r*.53);c.stroke();
}
c.restore();
}
function candyToy(c,item,opacity){
const r=rad(item);c.save();c.translate(item.x,item.y);c.rotate(item.a||0);
for(let k of [-1,1]){
  c.fillStyle='#ffb5dc';c.beginPath();c.moveTo(k*r*.62,-r*.3);
  c.lineTo(k*r*1.20,-r*.53);c.lineTo(k*r*1.12,r*.52);
  c.lineTo(k*r*.63,r*.3);c.closePath();c.fill();
  c.strokeStyle='#fff8';c.lineWidth=1.5;c.stroke();
}c.restore();
c._col=1;clay(c,item.x,item.y,r,false,item.a||0,item.impact||0,opacity);
c.save();c.translate(item.x,item.y);c.rotate(item.a||0);c.strokeStyle='#ffe8f9aa';c.lineWidth=r*.10;
c.beginPath();c.arc(0,0,r*.67,-1.3,.7);c.stroke();c.restore();
}
function toy(c,item,opacity){
if(item.col===-1){rainbowToy(c,item,opacity);return}
if(item.col===-2){candyToy(c,item,opacity);return}
if(item.col===-3){c.save();c.translate(item.x,item.y);glassBall(c,rad(item),item.id);c.restore();return}
c._col=item.col;clay(c,item.x,item.y,rad(item),item.big,item.a||0,item.impact||0,opacity);
fruitCandyDetail(c,item);
}
function drawPetal(c,p){
c.save();c.translate(p.x,p.y);c.rotate(p.rot);
c.globalAlpha=p.alpha*(p.settled?.53:1);
const s=p.size;c.fillStyle='#f7b7d2';c.strokeStyle='#e79cbd';c.lineWidth=.55;
c.beginPath();c.moveTo(0,s*.42);
c.bezierCurveTo(-s*.9,s*.06,-s*.53,-s*.92,0,-s*.8);
c.bezierCurveTo(s*.50,-s*.96,s*.91,.04*s,0,s*.42);
c.fill();c.stroke();
c.strokeStyle='#ffffff88';c.beginPath();c.moveTo(0,s*.36);c.lineTo(0,-s*.42);c.stroke();c.restore();
}
function updatePetals(dt){
petalClock+=dt;
if(petalClock>.43&&petals.length<28){
petalClock=0;petals.push({x:Math.random()*W,y:-15,size:4+Math.random()*5,rot:Math.random()*6,
vy:15+Math.random()*19,drift:8+Math.random()*12,phase:Math.random()*6,age:0,alpha:.48+Math.random()*.35,settled:false});
}
for(const p of petals){
p.age+=dt;
if(!p.settled){
p.y+=p.vy*dt;p.x+=Math.sin(p.age*1.6+p.phase)*p.drift*dt;p.rot+=dt*.28;
if(p.y>=H-4-Math.random()*3){p.settled=true;p.y=H-3-Math.random()*5;p.vy=0;p.rot=-.2+Math.random()*.4;}
}
}
petals=petals.filter(p=>p.age<(p.settled?18:28));
}
function heroDraw(){
h.save();h.scale(2,2);
const g=h.createLinearGradient(0,0,340,208);
g.addColorStop(0,'#fff0fa');g.addColorStop(.5,'#f4ddff');g.addColorStop(1,'#d8fff4');
h.fillStyle=g;h.fillRect(0,0,340,208);
for(const o of [
{x:33,y:129,col:0,r:23},{x:92,y:130,col:1,r:31},
{x:161,y:128,col:2,r:41},{x:258,y:122,col:3,r:54},
{x:211,y:55,col:4,r:54}]){
const item={...o,big:o.col>0,a:0,impact:0};
h._col=o.col;clay(h,o.x,o.y,o.r,item.big,0,0);
h.save();h.translate(o.x,o.y);h.scale(o.r/rad(item),o.r/rad(item));
h.translate(-o.x,-o.y);fruitCandyDetail(h,item);h.restore();
}
for(let i=0;i<12;i++)drawPetal(h,{x:19+i*29,y:18+i%4*35,rot:i*.71,size:5+i%3,alpha:.60,settled:false});
h.restore();
}heroDraw();
function weightedMochi(){
const v=Math.random()*100;
return v<54?0:v<84?1:v<94?2:v<98?3:4;
}
function newStone(){
if(!playing)return;
const density=items.filter(b=>!b.held)
  .reduce((v,b)=>v+Math.PI*rad(b)**2,0)/(W*H);
if(items.some(b=>!b.held&&b.y-rad(b)<78)||density>.68||items.length>=30){
  playing=false;locked=true;message='⛔ GAME OVER! '+points+' punktów';current=null;return;
}
const rain=!rainbow&&roundDrops>=25&&Math.random()<1/240;
if(rain)rainbow=true;
const candy=!rain&&roundDrops>=4&&Math.random()<1/26;
const col=rain?-1:candy?-2:weightedMochi();
const r=col<0?R1:mochiRadii[col];
aim=Math.max(r,Math.min(W-r,aim));
current={id:nextId++,x:aim,y:r+4,vx:0,vy:0,col,big:col>=1,a:0,spin:0,impact:0,held:true,isMoving:true,cool:.24};
heldFor=0;items.push(current);message='';
}
function reset(){items=[];puffs=[];petals=[];petalClock=0;aim=180;points=0;merges=0;accum=0;nextId=0;roundDrops=0;rainbow=false;locked=false;candyClears=0;marblesReleased=0;heldFor=0;roofFor=0;playing=true;message='';newStone()}
function toWorld(e){const rect=arena.getBoundingClientRect();return (e.clientX-rect.left)/rect.width*W}
function target(e){const r=current?rad(current):R1;aim=Math.max(r,Math.min(W-r,toWorld(e)));if(current&&current.held){current.x=aim;current.vx=0;current.a=0}}
let pointerDown=null;
arena.addEventListener('pointerdown',e=>{pointerDown={x:e.clientX,y:e.clientY,dragged:false};target(e);arena.setPointerCapture(e.pointerId)});
arena.addEventListener('pointermove',e=>{if(pointerDown){target(e);if(Math.hypot(e.clientX-pointerDown.x,e.clientY-pointerDown.y)>12)pointerDown.dragged=true}});
arena.addEventListener('pointerup',e=>{if(pointerDown&&!pointerDown.dragged)drop();else if(pointerDown&&e.clientY-pointerDown.y>58)drop();pointerDown=null});
arena.addEventListener('pointercancel',()=>{pointerDown=null});
function drop(){if(!playing||!current||!current.held)return;current.held=false;current.vy=Math.max(current.vy,120);current.isMoving=true}
function collide(a,b){const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy);const min=rad(a)+rad(b);if(d>=min)return;const nx=d>.01?dx/d:1,ny=d>.01?dy/d:.08;d=Math.max(.1,d);
const ia=(R1/rad(a))**2,ib=(R1/rad(b))**2,weight=ia+ib,overlap=Math.max(0,min-d)*.8;
a.x-=nx*overlap*ia/weight;a.y-=ny*overlap*ia/weight;b.x+=nx*overlap*ib/weight;b.y+=ny*overlap*ib/weight;
const v=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(v<0){const impulse=-v*1.03/weight;a.vx-=nx*impulse*ia;a.vy-=ny*impulse*ia;b.vx+=nx*impulse*ib;b.vy+=ny*impulse*ib;
a.spin=Math.max(-.3,Math.min(.3,a.spin+v*.00006));b.spin=Math.max(-.3,Math.min(.3,b.spin-v*.00006));}}
function bounds(b){const r=rad(b);if(b.x<r){b.x=r;b.vx=Math.max(0,b.vx)*.1}else if(b.x>W-r){b.x=W-r;b.vx=Math.min(0,b.vx)*.1}
if(b.y>H-r){b.y=H-r;if(b.vy>75){b.impact=Math.min(.45,b.vy/1100);b.vy*= -.08}else b.vy=0;b.vx*=.74}
if(b.y<r){b.y=r;b.vy=Math.max(0,b.vy)}}
function touching(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<=rad(a)+rad(b)+3}
function merge(){
for(let tier=4;tier>=0;tier--){
 const visited=new Set();
 for(const seed of items){
  if(seed.col!==tier||seed.cool>0||seed.held||visited.has(seed.id))continue;
  const group=[seed];visited.add(seed.id);
  for(let j=0;j<group.length;j++){
    for(const other of items){
      if(other.col===tier&&other.cool<=0&&!other.held&&
        !visited.has(other.id)&&touching(group[j],other)){
        visited.add(other.id);group.push(other);
      }
    }
  }
  const needed=tier===0?3:2;
  if(group.length<needed)continue;
  const found=group.slice(0,needed),
    x=found.reduce((v,b)=>v+b.x,0)/needed,
    y=found.reduce((v,b)=>v+b.y,0)/needed;
  const wasActive=found.includes(current);
  items=items.filter(q=>!found.includes(q));
  merges++;points+=tier===4?950:(tier+2)*90;
  if(tier===4){
    // A giant green POP clears every object, but glass marbles spill out.
    items=[];current=null;roofFor=0;
    puffs.push({x:Math.max(85,Math.min(W-85,x)),
       y:Math.max(85,Math.min(H-85,y)),col:4,age:0});
    for(let j=0;j<8;j++){
      const a=2*Math.PI*j/8;
      items.push({id:nextId++,col:-3,x:Math.max(12,Math.min(W-12,x+Math.cos(a)*21)),
        y:Math.max(12,Math.min(H-12,y+Math.sin(a)*19)),
        vx:Math.cos(a)*110,vy:-45+Math.sin(a)*35,
        spin:0,a:0,impact:0,cool:.6,held:false});
    }
    marblesReleased+=8;
    message='🟢 PUF! Szklane kuleczki!';
  }else{
    const col=tier+1,r=mochiRadii[col];
    const bigger={id:nextId++,x:Math.max(r,Math.min(W-r,x)),
      y:Math.max(r,Math.min(H-r,y)),vx:0,vy:0,col,big:true,
      a:0,spin:0,impact:.5,cool:.33,held:false};
    items.push(bigger);
    for(let k=0;k<8;k++){
      for(const other of items)if(other!==bigger&&!other.held)collide(bigger,other);
      items.forEach(v=>{if(!v.held)bounds(v)});
    }
    message='✨ '+mochiNames[col]+'!';
  }
  if(wasActive){current=null;roundDrops++;points+=5}
  return true;
 }
}
return false;
}
function simulate(dt){
if(current&&current.held){heldFor+=dt;if(heldFor>=5){drop();message=''}}
const blocked=items.some(b=>!b.held&&b.y-rad(b)<78);
roofFor=blocked?roofFor+dt:0;
if(roofFor>1.0){playing=false;locked=true;message='⛔ Zablokowana góra — KONIEC GRY! Wynik: '+points;return}
for(const p of puffs)p.age+=dt;puffs=puffs.filter(p=>p.age<1.45);updatePetals(dt);
for(const b of items){b.cool=Math.max(0,b.cool-dt);b.impact=Math.max(0,b.impact-dt*2.5);
if(b.held){b.x=aim;b.y=rad(b)+4;b.vx=b.vy=b.spin=b.a=0;continue}
if(b===current){b.vx+=Math.max(-650,Math.min(650,(aim-b.x)*14-b.vx*8))*dt}
b.vy=Math.min(340*(1+(speed-1)*.34),b.vy+520*(1+(speed-1)*.34)*dt);
b.vx=Math.max(-185,Math.min(185,b.vx*Math.exp(-2*dt)));b.spin=Math.max(-.42,Math.min(.42,b.spin*Math.exp(-4*dt)));
b.x+=b.vx*dt;b.y+=b.vy*dt;b.a=Math.max(-.24,Math.min(.24,b.a+b.spin*dt));bounds(b)}
for(let j=0;j<4;j++){for(let i=0;i<items.length;i++)for(let k=i+1;k<items.length;k++){if(!items[i].held&&!items[k].held)collide(items[i],items[k])}
items.forEach(b=>{if(!b.held)bounds(b)})}
for(let i=0;i<4;i++){if(!merge())break}
if(current&&!current.held){const b=current;let supported=b.y>=H-rad(b)-.7||items.some(q=>q!==b&&q.y>b.y&&touching(q,b));
if(supported&&Math.abs(b.vy)<70)b.rest=(b.rest||0)+dt;else b.rest=0;if(b.rest>.18){
current=null;roundDrops++;points+=5;
if(b.col===-1){
  items=[];roofFor=0;points+=250;message='🌈 TĘCZOWY CLEAR!';
  for(let j=0;j<6;j++)puffs.push({x:50+(j%3)*122,y:190+Math.floor(j/3)*145,col:j%6,age:j*.045});
}else if(b.col===-2){
  const cx=b.x,cy=b.y;items=items.filter(other=>
    other!==b&&((other.col===-1||other.col===-2)||Math.hypot(other.x-cx,other.y-cy)>116+rad(other)*.15));
  candyClears++;
  roofFor=0;points+=120;
  puffs.push({x:cx,y:cy,col:1,age:0});
  message='🍬 CUKIERKOWE PUF!';
}
newStone()}}
if(!current&&playing)newStone()
}
function puffDraw(c,p){const t=p.age/1.45;c.save();c.translate(p.x,p.y);if(t<.42){let grow=Math.min(1,t/.33),alpha=t<.33?1:Math.max(0,(.42-t)/.09);c._col=p.col;clay(c,0,0,48+grow*19,true,0,0,alpha)}
if(t>=.29){let st=Math.max(0,(t-.29)/.71),alpha=Math.pow(1-st,1.35);
for(let i=0;i<11;i++){const a=i*Math.PI*2/11,d=12+st*(39+i%3*4),x=Math.cos(a)*d,y=Math.sin(a)*d-st*14,r=14+(i%3)*3+st*8;
const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,'+(alpha*.7)+')');g.addColorStop(.55,'rgba(233,215,240,'+(alpha*.38)+')');g.addColorStop(1,'rgba(233,215,240,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}}c.restore()}
function paint(){ctx.clearRect(0,0,720,930);ctx.save();ctx.scale(2,2);
for(const p of petals.filter(p=>p.settled))drawPetal(ctx,p);
for(const b of items)toy(ctx,b);
for(const p of puffs)puffDraw(ctx,p);
for(const p of petals.filter(p=>!p.settled))drawPetal(ctx,p);
ctx.restore();document.getElementById('hud').textContent='⭐ '+points+'　🍡 '+merges;
const counter=document.getElementById('countdown');
const countdown=playing&&current&&current.held&&heldFor>=2?Math.max(1,3-Math.floor(heldFor-2)):0;
counter.style.display=countdown?'flex':'none';
if(countdown&&counter.textContent!==String(countdown)){counter.textContent=String(countdown);counter.style.animation='none';void counter.offsetWidth;counter.style.animation='pulse .45s ease-in-out';}
if(!countdown)counter.textContent='';
document.getElementById('message').textContent=(!playing||message.includes('PUF')||message.includes('poduszka')||message.includes('zablok'))?message:'';
}
function loop(ts){if(!last)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;if(playing){accum+=dt;let n=0;while(accum>=1/120&&n<8){simulate(1/120);accum-=1/120;n++}}paint();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
document.getElementById('start').onclick=()=>{document.getElementById('home').style.display='none';document.getElementById('gameScreen').style.display='block';reset()};
document.getElementById('restart').onclick=reset;
document.getElementById('back').onclick=()=>{playing=false;document.getElementById('gameScreen').style.display='none';document.getElementById('home').style.display='block'};
})();
</script>
