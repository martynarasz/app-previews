<style>:root{color-scheme:light;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#77568f;background:#efe6fb;}
*{box-sizing:border-box}html{min-height:100%;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse 85% 58% at 4% 10%,#fff5ff 0%,transparent 69%),radial-gradient(ellipse 60% 65% at 90% 82%,#d9c7ff 0%,transparent 72%),linear-gradient(155deg,#f9eafc,#f9f0fc 49%,#eae1ff);}
.shell{width:min(100%,490px);margin:auto;padding:16px 14px 20px;text-align:center}.stars{font-size:21px;letter-spacing:8px;color:#df9ecd;height:27px}header{padding:1px 0 12px}.eyebrow{margin:1px 0 2px;text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:3.3px;color:#ae85bc}h1{margin:0;font-size:clamp(36px,9vw,48px);letter-spacing:-2px;line-height:1.12;color:#9f62b3;text-shadow:0 3px #fff,0 9px 14px #d2a2ce6b}h1 span{color:#ed8cc0}h1 b{font-weight:800;color:#f6a0bf}.subheading{margin:5px 0 0;font-size:12px;color:#b38fbe;font-weight:700}
.pet-frame{padding:11px 11px 9px;border:3px solid #fff;border-radius:35px;background:linear-gradient(150deg,#fffaffed,#fbf4ffee);box-shadow:inset 0 3px 6px #ffffff,0 11px 32px #9971b52c,0 0 0 3px #edddf2;}
.frame-top{display:flex;align-items:center;justify-content:space-between;height:38px;padding:0 10px 8px;color:#b397b9;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:900}.window-dots{display:flex;gap:5px}.window-dots i{width:9px;height:9px;border-radius:50%;background:#ef91c4}.window-dots i:nth-child(2){background:#f6ce89}.window-dots i:nth-child(3){background:#a1ddc4}.counter{padding:5px 10px;background:#fff;border:1px solid #f5d5eb;border-radius:12px;color:#db78b0;font-size:13px;letter-spacing:0}
.arena{position:relative;overflow:hidden;width:100%;height:clamp(380px,61dvh,555px);min-height:350px;border-radius:26px;touch-action:none;user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse 85% 60% at 52% 62%,#fff3ff 0%,transparent 72%),linear-gradient(180deg,#eedbf7 0%,#f6e6fa 55%,#fce5f4 100%);border:3px solid #f3d6f4;box-shadow:inset 0 4px 20px #c39bdd38,inset 0 -20px 28px #f7c5dd57}
.arena:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#bda3ce24 1px,transparent 1px),linear-gradient(90deg,#bda3ce24 1px,transparent 1px);background-size:36px 36px;opacity:.55;}
.arena:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 10px 3px 19px #ffffff73,inset -12px 0 20px #ffffff73}
#world{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none}.arena-sparkle{position:absolute;pointer-events:none;color:#fff;filter:drop-shadow(0 0 7px #fff);z-index:0}.sparkle-a{left:15%;top:15%;font-size:35px}.sparkle-b{right:12%;top:31%;font-size:31px;color:#edabdf}.sparkle-c{left:22%;bottom:28%;font-size:23px}.hint{position:absolute;z-index:2;bottom:20px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:9px 16px;border-radius:50px;background:#fffbffb8;color:#ac82ad;font-size:12px;font-weight:750;pointer-events:none;transition:opacity .4s}
.note{font-size:12px;color:#ab8bba;font-weight:800;min-height:18px;margin:9px auto 2px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px 1px 0}.control{border:2px solid #fff;min-height:47px;border-radius:19px;font-weight:850;color:#9867b7;cursor:pointer;font-size:14px;background:#fbf8ff;box-shadow:0 5px 16px #b584bc31;touch-action:manipulation}.control:active{transform:scale(.97)}.control.primary{color:#fff;background:linear-gradient(135deg,#f4a0c8,#c592e1)}.control.wide{grid-column:span 2;color:#a071aa;min-height:44px;font-size:12px}.control:disabled{opacity:.62;cursor:default}.helper{font-size:10px;line-height:1.45;color:#b8a0c4;max-width:330px;margin:9px auto 0}footer{font-size:10px;margin-top:18px;color:#b8a0c4;font-weight:700;letter-spacing:.5px}footer span{color:#f4b2d4}
@media(min-height:920px){.arena{height:min(61dvh,590px)}}@media(max-height:690px){.arena{height:355px}h1{font-size:35px}.shell{padding-top:8px}.subheading{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}

  <main class="shell">
    <div class="stars" aria-hidden="true">✦ &nbsp; ✧ &nbsp; ✦</div>
    <header>
      <p class="eyebrow">a tiny squishy friend</p>
      <h1>Squishy <span>Chick</span> <b>♡</b></h1>
      <p class="subheading">A little happiness in your pocket!</p>

    <section class="pet-frame" aria-label="Interaktywny zwierzak Squishy Chick">

        <div class="window-dots" aria-hidden="true"><i></i><i></i><i></i></div>

        <div class="counter" aria-live="polite">♥ <span id="heart-count">0</span></div>

        <div class="arena-sparkle sparkle-b" aria-hidden="true">✧</div>
        <div class="arena-sparkle sparkle-c" aria-hidden="true">✦</div>
        <canvas id="world" aria-label="Squishy Chick w pudełku"></canvas>
        <div class="hint" id="hint">Tap to make me bounce! ♡</div>
      </div>
      <p class="note" id="status" aria-live="polite">Tap, drag &amp; shake to play</p>
    </section>
    <div class="controls">
      <button type="button" id="bounce" class="control primary">♡ Podskok</button>
      <button type="button" id="shake" class="control">✦ Potrząśnij</button>
      <button type="button" id="sensors" class="control wide">📱 Włącz czujniki telefonu</button>
    </div>
    <p class="helper" id="sensor-help">Na iPhonie zezwól na ruch po kliknięciu. Funkcja wymaga HTTPS.</p>
    <footer>Squishy Pocket Pets · Chick Edition <span>✿</span></footer>
  </main>

  let start = null, prev = null, holdTimer = 0, particles = [];
  const pet = {x: 160,y: 160,vx: 0,vy: 0,rotation: 0,spin:0,squash:0,glow:0};
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const radius = () => Math.min(width*.25, 94);
  const ry = () => radius()*.74;
  const ground = () => height - ry() - 12;
  const within = (x,y) => Math.hypot(x-pet.x,y-pet.y) < radius()*1.2;
  function resize(){
    const box=arena.getBoundingClientRect(), oldWidth=width, oldHeight=height;
    width=box.width;height=box.height;
    const dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    pet.x=clamp(pet.x/oldWidth*width,radius()+5,width-radius()-5);
    pet.y=clamp(pet.y/oldHeight*height,ry()+4,ground());
  }
  function burst(n=5){
    for(let i=0;i<n;i++)particles.push({x:pet.x+(Math.random()-.5)*radius(),y:pet.y-ry()*.6,vx:(Math.random()-.5)*135,vy:-105-Math.random()*120,life:1.2+Math.random()*.5,size:12+Math.random()*13,type:Math.random()>.3?'♥':'✦'});
    hearts+=1;countEl.textContent=hearts.toString();
    try{localStorage.setItem('squishy-chick-hearts',String(hearts))}catch(_e){}
  }
  function hop(force=1){
    pet.vy=-clamp(320*force,200,650);
    pet.vx+=(Math.random()-.5)*150;
    pet.spin+=(Math.random()-.5)*5.2;
    pet.squash=-.21;pet.glow=1;
    if(reduced){pet.vy*=.6;pet.spin*=.2}
    burst(4); idleTime=0;
    hint.style.opacity='0';statusEl.textContent='Yay! ♡';
  }
  function shake(manual=false){
    const now=performance.now();if(now-lastShake<750)return;
    lastShake=now;
    pet.vx+=(Math.random()>.5?1:-1)*(170+Math.random()*160);
    pet.vy=-360-Math.random()*115;
    pet.spin+=(Math.random()>.5?1:-1)*7;
    pet.squash=.24;pet.glow=1;
    burst(10);hint.style.opacity='0';statusEl.textContent=manual?'Wheee! ✦':'You shook me! ♡';
  }
  function draw(dt){
    ctx.clearRect(0,0,width,height);
    // Soft floor
    const floor=ctx.createLinearGradient(0,ground(),0,height);
    floor.addColorStop(0,'#f9badf10');floor.addColorStop(1,'#eab0d95e');
    ctx.fillStyle=floor;ctx.fillRect(0,ground()+ry()*.7,width,height);
    if(!dragging){
      pet.vy+=980*dt;
      pet.vx+=tilt*360*dt;
      pet.x+=pet.vx*dt;
      pet.y+=pet.vy*dt;
      pet.rotation+=pet.spin*dt;
      const left=radius()*.9,right=width-radius()*.9;
      if(pet.x<left){pet.x=left;pet.vx=Math.abs(pet.vx)*.78;pet.spin+=1.2;pet.squash=.1}
      if(pet.x>right){pet.x=right;pet.vx=-Math.abs(pet.vx)*.78;pet.spin-=1.2;pet.squash=.1}
      if(pet.y<ry()){pet.y=ry();pet.vy=Math.abs(pet.vy)*.65;pet.squash=-.15}
      if(pet.y>ground()){
        const speed=Math.abs(pet.vy);
        pet.y=ground();
        pet.vy=speed>90?-Math.min(speed*.64,470):0;
        if(speed>100){pet.squash=.25;pet.spin+=pet.vx*.003}
        pet.vx*=.94;
      }
      pet.vx*=Math.pow(.997,dt*60);
      pet.spin*=Math.pow(.976,dt*60);
      if(Math.abs(pet.spin)<.02)pet.spin=0;
      if(Math.abs(pet.vx)<.25)pet.vx=0;
    }
    pet.squash*=Math.pow(.85,dt*60);pet.glow*=Math.pow(.92,dt*60);
    // Shadow below sprite
    const shadowDistance=clamp((ground()-pet.y)/height,0,1);
    ctx.save();ctx.fillStyle=`rgba(167,90,163,${.17-shadowDistance*.12})`;
    ctx.beginPath();ctx.ellipse(pet.x,ground()+ry()*.92,radius()*(.9-shadowDistance*.25),radius()*.12,0,0,Math.PI*2);ctx.fill();ctx.restore();
    // Character sprite, squash and stretch on impact and bounce
    ctx.save();ctx.translate(pet.x,pet.y);
    const sx=1+pet.squash,sy=1-pet.squash*.75;
    ctx.rotate(pet.rotation);ctx.scale(sx,sy);
    const drawW=radius()*2.2,drawH=radius()*1.66;
    if(petImage.complete && petImage.naturalWidth){
      ctx.shadowColor='#fcb6df';ctx.shadowBlur=10+pet.glow*25;
      ctx.drawImage(petImage,-drawW/2,-drawH/2,drawW,drawH);
    }else{
      // Offline fallback until sprite loads
      ctx.shadowColor='#ffc0ec';ctx.shadowBlur=16;
      ctx.fillStyle='#ffe48b';ctx.beginPath();ctx.ellipse(0,0,radius(),ry(),0,0,7);ctx.fill();
      ctx.fillStyle='#fff0f3';ctx.beginPath();ctx.arc(0,12,radius()*.65,0,7);ctx.fill();
      ctx.fillStyle='#754871';ctx.beginPath();ctx.arc(-radius()*.25,2,7,0,7);ctx.arc(radius()*.25,2,7,0,7);ctx.fill();
    }
    ctx.restore();
    particles=particles.filter(p=>p.life>0);
    for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;
      ctx.save();ctx.globalAlpha=clamp(p.life/.65,0,1);ctx.font=`bold ${p.size}px system-ui`;ctx.textAlign='center';ctx.fillStyle=p.type==='♥'?'#ed77aa':'#fff';ctx.shadowBlur=8;ctx.shadowColor='#fff';ctx.fillText(p.type,p.x,p.y);ctx.restore();
    }
    idleTime+=dt;
    if(idleTime>8 && !dragging && pet.y>=ground()-2){idleTime=0;if(!reduced && Math.random()>.2){pet.vy=-180;pet.vx+=(Math.random()-.5)*70;pet.squash=-.09}}
  }
  function animate(now){const dt=Math.min((now-last)/1000||.016,.034);last=now;draw(dt);requestAnimationFrame(animate)}
  const point=e=>{const a=arena.getBoundingClientRect();return{x:e.clientX-a.left,y:e.clientY-a.top}};
  function pointerDown(e){
    if(e.button!==undefined&&e.button!==0)return;
    const p=point(e);start={...p,time:performance.now(),pointerId:e.pointerId,onPet:within(p.x,p.y)};
    if(start.onPet){prev={...p,time:performance.now()};dragging=true;pet.vx=0;pet.vy=0;pet.spin=0;
      if(arena.setPointerCapture)arena.setPointerCapture(e.pointerId);
      holdTimer=setTimeout(()=>{if(start && Math.hypot(pet.x-start.x,pet.y-start.y)<22){pet.squash=.35;burst(6);statusEl.textContent='Cuddle time! ♡';}},530);
    }
  }
  function pointerMove(e){if(!start||!dragging)return;
    const p=point(e),t=performance.now(),dt=Math.max((t-prev.time)/1000,.01);
    pet.vx=clamp((p.x-prev.x)/dt,-800,800);pet.vy=clamp((p.y-prev.y)/dt,-800,800);
    pet.x=clamp(p.x,radius()*.9,width-radius()*.9);
    pet.y=clamp(p.y,ry(),ground());
    pet.rotation=clamp(pet.rotation+(p.x-prev.x)*.006,-1.6,1.6);
    prev={...p,time:t};idleTime=0;
    if(Math.hypot(p.x-start.x,p.y-start.y)>12)clearTimeout(holdTimer);
  }
  function pointerUp(e){if(!start||start.pointerId!==e.pointerId)return;clearTimeout(holdTimer);
    const p=point(e),moved=Math.hypot(p.x-start.x,p.y-start.y),duration=performance.now()-start.time;
    if(start.onPet){dragging=false;if(moved<14 && duration<520){hop(1)}else if(moved<14){pet.squash=.25;pet.vy=-150;burst(4)}else{pet.vx*=.7;pet.vy*=.65;pet.spin+=pet.vx*.006;statusEl.textContent='Wheee! ✦';}}
    else if(moved<22)hop(.9);
    start=null;prev=null;
  }
  let lastSensor=0;
  function onMotion(e){
    const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;
    const intensity=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);
    // high motion, throttled; 9.8 m/s² includes gravity
    const now=performance.now();if(intensity>21&&now-lastSensor>800){lastSensor=now;shake()}
  }
  function onOrientation(e){if(typeof e.gamma==='number')tilt=clamp(e.gamma/40,-1,1)}
  async function enableSensors(){
    try{
      if(!window.isSecureContext){statusEl.textContent='Wymagany HTTPS dla czujników';return}
      if(typeof DeviceMotionEvent==='undefined'){statusEl.textContent='Brak czujników ruchu';return}
      if(typeof DeviceMotionEvent.requestPermission==='function'){
        const permission=await DeviceMotionEvent.requestPermission();
        if(permission!=='granted'){statusEl.textContent='Nie udzielono dostępu do ruchu';return}
      }
      if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
        try{await DeviceOrientationEvent.requestPermission()}catch(_e){}
      }
      if(!motionOn){window.addEventListener('devicemotion',onMotion);window.addEventListener('deviceorientation',onOrientation);motionOn=true}
      sensorButton.textContent='✓ Czujniki włączone';sensorButton.disabled=true;
      motionHint.textContent='Potrząśnij telefonem albo przechyl, żeby pobawić się z Squishy.';
      statusEl.textContent='Shake your phone! ♡';
    }catch(e){statusEl.textContent='Czujniki niedostępne w tej przeglądarce'}
  }
  arena.addEventListener('pointerdown',pointerDown);
  arena.addEventListener('pointermove',pointerMove);
  arena.addEventListener('pointerup',pointerUp);
  arena.addEventListener('pointercancel',pointerUp);
  document.getElementById('bounce').addEventListener('click',()=>hop(1));
  document.getElementById('shake').addEventListener('click',()=>shake(true));
  sensorButton.addEventListener('click',enableSensors);
  try{hearts=clamp(Number(localStorage.getItem('squishy-chick-hearts'))||0,0,999999);countEl.textContent=hearts.toString()}catch(_e){}
  pet.x=180;pet.y=160;
  resize();pet.x=width*.5;pet.y=height*.32;
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(arena);else window.addEventListener('resize',resize);
  requestAnimationFrame(animate);
  // PWA offline support: iPhone installs this website from Safari over HTTPS.
  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {
        // Interactive pet works even if offline installation is unavailable.
      });
    });
  }
})();
</script></body>
